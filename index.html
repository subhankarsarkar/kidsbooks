<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Story Nook</title>
<style>
:root{--bg:#fff7e6;--card:#ffffff;--ink:#3b2f2f;--muted:#7a6a5f;--accent:#ff8a3d;--shadow:rgba(120,80,30,.18);color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a2b;--card:#2a2640;--ink:#f5efe6;--muted:#b9b0c9;--accent:#ffa45c;--shadow:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1d1a2b;--card:#2a2640;--ink:#f5efe6;--muted:#b9b0c9;--accent:#ffa45c;--shadow:rgba(0,0,0,.4)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
h1{text-align:center;margin:12px 12px 4px;font-size:clamp(1.6rem,6vw,2.4rem)}
.sub{text-align:center;color:var(--muted);margin:0 12px 12px}
.top{max-width:820px;margin:0 auto;padding:12px 18px 0}
.top a{color:var(--ink);text-decoration:none;font-weight:700;background:var(--card);padding:8px 14px;border-radius:999px;box-shadow:0 3px 8px var(--shadow);display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 12px 14px}
.chip{border:2px solid var(--accent);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-weight:700;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--accent);color:#2b1a05}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;max-width:820px;margin:0 auto;padding:8px 18px 30px}
.book{display:flex;flex-direction:column;border:0;padding:0;background:var(--card);border-radius:16px;box-shadow:0 6px 14px var(--shadow);cursor:pointer;overflow:hidden;color:var(--ink);font:inherit;text-align:center;transition:transform .15s}
.book:hover,.book:focus-visible{transform:translateY(-4px) rotate(-1deg);outline:3px solid var(--accent)}
.cover{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:4.2rem;border-left:10px solid rgba(0,0,0,.18)}
.book b{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 8px 12px;font-size:1rem;line-height:1.2;min-height:4.2em}
#reader{display:none;max-width:720px;margin:0 auto;padding:12px 16px 24px;min-height:100vh;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar h2{margin:0;font-size:1.1rem;flex:1;text-align:center}
button.btn{border:0;border-radius:999px;background:var(--accent);color:#2b1a05;font:inherit;font-weight:700;padding:10px 18px;cursor:pointer;box-shadow:0 3px 8px var(--shadow)}
button.btn:disabled{opacity:.35;cursor:default}
.page{flex:1;background:var(--card);border-radius:22px;box-shadow:0 8px 20px var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.scene{flex:1;min-height:220px;display:flex;align-items:center;justify-content:center;font-size:clamp(4rem,18vw,7.5rem);letter-spacing:.1em;padding:16px;text-align:center}
.text{padding:18px 22px 24px;font-size:clamp(1.15rem,4.2vw,1.5rem);line-height:1.5;text-align:center}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.4}.dots i.on{background:var(--accent);opacity:1;transform:scale(1.3)}
.text:lang(bn),.text:lang(hi){line-height:1.9}
.book b:lang(bn),.book b:lang(hi),#title:lang(bn),#title:lang(hi){line-height:1.5}
.scene.sm{font-size:clamp(1.5rem,7.5vw,3rem);line-height:1.5;white-space:pre-line;letter-spacing:.04em}
.text.list{white-space:pre-line;font-size:clamp(1.05rem,3.8vw,1.35rem);line-height:1.6;text-align:left;width:fit-content;max-width:100%;margin:0 auto}
.text.list:lang(bn),.text.list:lang(hi){line-height:1.75}
</style>
</head>
<body>
<main id="home">
    <h1>📚 Little Story Nook</h1>
  <p class="sub">Tap a book to start reading</p>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>
<section id="reader" aria-live="polite">
  <div class="bar"><button class="btn" id="back">← Back</button><h2 id="title"></h2><button class="btn" id="speak" aria-label="Read aloud">🔊</button></div>
  <div class="page"><div class="scene" id="scene"></div><div class="text" id="text"></div></div>
  <div class="nav"><button class="btn" id="prev">◀ Previous</button><div class="dots" id="dots"></div><button class="btn" id="next">Next ▶</button></div>
</section>
<script>
var CATS=[["all","⭐ All"],["lessons","🌟 Lessons"],["kindness","💛 Kindness"],["bedtime","🌙 Bedtime"],["fairy","🧚 Fairy Tales"],["learn","🔤 Learn"],["rhymes","🎵 Rhymes"],["bn","বাংলা"],["hi","हिन्दी"]];
var BOOKS=[
{id:"tortoise-and-hare",cat:"lessons",title:"The Tortoise and the Hare",emoji:"🐢",color:"#c8f0c0",pages:[
 ["🐇💨 🐢","A speedy hare liked to boast, “Nobody can run as fast as me!” A slow, kind tortoise smiled and said, “Let’s have a race.”"],

 ["🌳😴🐇","The hare felt sure he would win. “I’ll take a little nap,” he yawned, and fell fast asleep under a tree."],
 ["🐢🚶🏁","The tortoise never stopped. Slowly, slowly, he walked past the sleeping hare and kept going."],

{id:"thirsty-crow",cat:"lessons",title:"The Thirsty Crow",emoji:"🐦‍⬛",color:"#d6e4ff",pages:[
 ["☀️🐦‍⬛🥵","It was a hot, hot day. A little crow flew and flew, looking for water. He was so thirsty!"],

{id:"lion-and-mouse",cat:"kindness",title:"The Lion and the Mouse",emoji:"🦁",color:"#ffe3b3",pages:[
 ["🦁😴🐭","A big lion was sleeping when a tiny mouse ran over his paw. The lion woke up with a roar!"],
 ["🦁🐭🥺","“Please let me go,” squeaked the mouse. “One day I will help you.” The lion laughed, but he let her go."],

 ["🦁🐭💛","The lion was free! “Thank you, my friend,” he said. Even the smallest friend can be a big help."]]},
{id:"sleepy-star",cat:"bedtime",title:"The Sleepy Little Star",emoji:"⭐",color:"#e5d4ff",pages:[
 ["🌙⭐😴","High in the night sky lived a little star named Twinkle. Tonight, Twinkle felt very sleepy."],
 ["☁️⭐🥱","“I can’t shine anymore,” yawned Twinkle. A soft cloud floated near and whispered, “Come rest with me.”"],
 ["🌙🎶⭐","The Moon hummed a gentle lullaby, la-la-la, and the other stars sparkled quietly around her."],
 ["☁️💤⭐","Twinkle snuggled into the fluffy cloud and closed her eyes. Her light became soft and glowing."],
 ["🏡🌃💫","Down below, a child looked up and smiled. “Goodnight, little star.” And everyone slept happily."]]},
{id:"fox-and-grapes",cat:"lessons",title:"The Fox and the Grapes",emoji:"🦊",color:"#ffd3d3",pages:[
 ["🦊🍇☀️","One sunny day, a hungry fox saw a bunch of juicy purple grapes hanging high on a vine."],
 ["🦊⬆️🍇","The fox jumped as high as he could. But the grapes were too far away. He tried again and again."],
 ["🦊😤🍇","Jump after jump, he still could not reach them. The fox felt tired and a little grumpy."],
 ["🦊🚶🍇","“Those grapes are probably sour anyway,” he said, and walked away with his nose in the air."],
 ["🦊🤔💭","But the grapes were not sour at all. It is not kind to blame things when we cannot have them. Let’s try our best, and be honest."]]},
{id:"ant-and-grasshopper",cat:"lessons",title:"The Ant and the Grasshopper",emoji:"🐜",color:"#e2f5c6",pages:[
 ["🌞🦗🎶","All summer long, a grasshopper sang and played in the warm sunshine."],
 ["🐜🌾💪","A little ant worked hard every day, carrying grains of food to her nest. “Come and play!” said the grasshopper."],
 ["🐜🏠🌾","“I am saving food for winter,” said the ant. The grasshopper only laughed and went on singing."],
 ["❄️🦗🥶","Then winter came, cold and snowy. The grasshopper had no food and no warm home."],
 ["🐜🦗🍲","The kind ant shared her food. “Next summer, I will work first and play after,” said the grasshopper."]]},
{id:"ugly-duckling",cat:"kindness",title:"The Ugly Duckling",emoji:"🦆",color:"#fff0b8",pages:[
 ["🥚🦆🐣","One spring, a mother duck’s eggs hatched. One duckling looked different from the others, and they teased him."],
 ["🦆😢🌧️","Feeling sad, the little duckling wandered away. He felt lonely through the long, cold winter."],
 ["🌷☀️🦆","When spring returned, he saw beautiful white birds gliding on a lake. He swam toward them, feeling shy."],
 ["🦆🪞💧","He looked into the water and gasped. He was not a duckling at all. He had grown into a graceful swan!"],
 ["🦢💛🦢","The swans welcomed him warmly. Everyone is special in their own way, so let’s always be kind."]]},
{id:"little-bear-goodnight",cat:"bedtime",title:"Little Bear’s Goodnight",emoji:"🐻",color:"#ffe0c8",pages:[
 ["🐻🌙🌲","The sun went down, and the forest grew quiet. Little Bear was not ready to sleep yet."],
 ["🐻🦉🌳","“Who-who is awake?” asked a wise owl. “Close your eyes and listen to the night,” she said softly."],
 ["🐻🦗🎵","Little Bear heard crickets singing, leaves whispering, and a stream bubbling. It was so peaceful."],
 ["🐻🧸💤","He hugged his teddy tight and yawned a great big yawn. His eyes grew heavy."],
 ["🏡🌙😴","Mama Bear tucked him in and kissed his nose. “Goodnight, Little Bear.” And the whole forest slept."]]}
,{id:"three-little-pigs",cat:"lessons",title:"The Three Little Pigs",emoji:"🐷",color:"#ffd9e4",pages:[
 ["🐷🐷🐷🏡","Three little pigs left home to build houses of their own. A big, hungry wolf lived nearby."],
 ["🐷🌾🪵","The first pig built a house of straw. The second pig built a house of sticks. Both finished quickly and went out to play."],
 ["🐷🧱🔨","The third pig took his time and built a strong house of bricks. “Hard work now keeps me safe later,” he said."],
 ["🐺💨🏚️","The wolf huffed and puffed and blew down the straw house and the stick house. The two pigs ran to their brother’s house."],
 ["🐺💨🧱🐷","The wolf huffed and puffed at the brick house, but it did not move. The pigs were safe together, and the wolf went away."]]},
{id:"goldilocks",cat:"fairy",title:"Goldilocks and the Three Bears",emoji:"🥣",color:"#fff1b8",pages:[
 ["🌲🏡👧","A little girl named Goldilocks was walking in the forest when she found a cosy cottage. Nobody was home, so she peeked inside."],
 ["🥣🥣🥣","On the table were three bowls of porridge. One was too hot, one was too cold, and the little one was just right!"],
 ["🪑🪑🪑","She tried three chairs. The big one was too hard, the middle one was too soft, and the tiny one was just right, until it broke!"],
 ["🛏️😴👧","Feeling sleepy, she tried three beds and fell asleep in the little one. Soon the three bears came home."],
 ["🐻🐻🐻👧","“Someone has been in our house!” said the bears. Goldilocks woke up, said “I’m sorry,” and hurried home. She learned to always ask first."]]},
{id:"red-riding-hood",cat:"fairy",title:"Little Red Riding Hood",emoji:"🧣",color:"#ffc9c9",pages:[
 ["🧣🧺🌲","A girl in a red hood set off with a basket of treats for her grandmother, who lived through the woods. “Stay on the path,” said her mother."],
 ["🐺🌸👧","On the way, a sly wolf asked where she was going. She told him, and the wolf ran ahead by a shorter way."],
 ["🐺🏠👵","The wolf reached Grandmother’s house first and hid. When the girl arrived, something looked very strange."],
 ["👧❓🐺","“What big eyes you have!” she said. She knew something was wrong and shouted for help."],
 ["🪓🌳🏠","A kind woodcutter heard her and chased the wolf away. Grandmother was safe. The girl promised to listen to her mother and never trust strangers."]]},
{id:"boy-who-cried-wolf",cat:"lessons",title:"The Boy Who Cried Wolf",emoji:"🐑",color:"#e6f0ff",pages:[
 ["🐑🐑👦⛰️","A shepherd boy watched his sheep on a hill near a village. Every day was quiet, and he felt bored."],
 ["👦😆🐺","For fun, he shouted, “Wolf! Wolf!” The villagers ran up the hill to help, but there was no wolf. The boy laughed."],
 ["👦😆🏃","He played the trick again. The villagers came running a second time, and they were not happy."],
 ["🐺🐑😱","Then a real wolf came! “Wolf! Wolf!” the boy cried. This time nobody came, because they thought it was another trick."],
 ["👦😢🌅","The boy lost some sheep and learned a big lesson. Nobody believes a person who tells lies, even when they finally tell the truth."]]},
{id:"gingerbread-man",cat:"fairy",title:"The Gingerbread Man",emoji:"🍪",color:"#f3d9c0",pages:[
 ["👵🍪🏠","An old woman baked a gingerbread man with raisin eyes and a candy smile. Suddenly he jumped up and ran out the door!"],
 ["🍪💨🏃","“Run, run, as fast as you can! You can’t catch me, I’m the Gingerbread Man!” he sang. Everyone chased him."],

 ["🦊😋🍪","The fox tossed him up and, gulp, the Gingerbread Man was gone. Let’s remember not to be too proud, and not to trust everyone who sounds friendly."]]},
{id:"jack-and-beanstalk",cat:"fairy",title:"Jack and the Beanstalk",emoji:"🫘",color:"#d4f0d0",pages:[
 ["👦🐄🫘","Jack and his mother were very poor. She sent him to sell their cow, but Jack traded it for a handful of magic beans."],
 ["🌱⬆️☁️","Next morning, a giant beanstalk had grown up into the clouds! Jack climbed and climbed all the way to the top."],
 ["🏰👹☁️","At the top stood a castle where a giant lived. Jack tiptoed inside, quiet as a mouse."],
 ["🥚🪙🐔","Jack found a hen that laid golden eggs. He grabbed her, slipped out, and raced down the beanstalk as the giant woke."],
 ["🪓🌱🏡","Jack chopped down the beanstalk, and the giant could not follow. Jack and his mother were never poor again."]]},
{id:"monkey-and-crocodile",cat:"lessons",title:"The Monkey and the Crocodile",emoji:"🐒",color:"#ffe8c2",pages:[
 ["🐒🌳🌊","A clever monkey lived in a mango tree by a river. He shared his sweet mangoes with a crocodile who came to visit."],
 ["🐊🥭🏠","The crocodile took mangoes home to his wife. She had a wicked plan and told him, “Bring the monkey to our home.”"],
 ["🐊🐒🌊","“Come and visit my home!” said the crocodile. The monkey hopped on his back, and they swam into the deep river."],
 ["🐊😳🐒","Halfway across, the crocodile confessed the plan. The monkey stayed calm. “Oh dear! I left my heart in the tree. Take me back to fetch it.”"],
 ["🌳🐒😄","Back at the shore, the monkey leapt into his tree. “Silly crocodile! Nobody keeps their heart in a tree!” Quick thinking saved the day."]]},
{id:"blind-men-and-elephant",cat:"lessons",title:"The Blind Men and the Elephant",emoji:"🐘",color:"#dfe6f2",pages:[
 ["👨‍🦯👨‍🦯🐘","In an old story from India, some blind men heard that an elephant had come to town. None of them had ever met one, so they went to touch it."],
 ["🐘🦷🤲","One man touched the tusk and said, “An elephant is like a spear!” Another touched its side and said, “No, it is like a wall!”"],
 ["🐘🦵🌳","A third touched the leg. “It’s like a tree!” A fourth held the trunk. “It’s a snake!”"],
 ["🐘👂🪭","The fifth touched the ear and said, “A fan!” The sixth held the tail and cried, “A rope!” They began to argue loudly."],
 ["🐘💡🤝","A wise man said, “Each of you is right about one part. Put them together, and you know the whole elephant.” Listening to others helps us see the whole truth."]]},
{id:"elves-and-shoemaker",cat:"kindness",title:"The Elves and the Shoemaker",emoji:"🧝",color:"#e0d4ff",pages:[
 ["👞🧵😟","A kind shoemaker became so poor that he had leather for only one pair of shoes. He cut it out and went to bed."],
 ["🌙🧝👞","In the morning, a beautiful pair of shoes sat on his table, perfectly made! A customer bought them happily."],
 ["🪙👞👞","With the money, he bought leather for two pairs. The next morning, two perfect pairs were ready. This kept happening."],
 ["🌙👀🧝","One night, the shoemaker and his wife hid and watched. Two tiny elves in ragged clothes came in, sewing and hammering."],
 ["🧥🎁🧝","To say thank you, they made little clothes and tiny shoes for the elves. The elves danced with joy, and the shoemaker was never poor again."]]},
{id:"cinderella",cat:"kindness",title:"Cinderella",emoji:"👠",color:"#d9ecff",pages:[
 ["👧🧹🏠","Cinderella was kind and gentle, but her stepmother and stepsisters made her do all the housework."],
 ["💌👗🏰","The prince invited everyone to a royal ball. Cinderella had no gown, and her stepfamily left without her. She cried."],
 ["🧚‍♀️✨🎃","Her fairy godmother appeared with a wave of her wand. A pumpkin became a coach, and rags became a shining gown with glass slippers. “Be home by midnight!”"],
 ["🕛👠🏃","At the ball, Cinderella danced with the prince. When the clock struck twelve, she ran, leaving one glass slipper on the stairs."],
 ["👠👸💖","The prince searched the kingdom, and the slipper fit only Cinderella. Kindness is the greatest magic of all."]]}
,{id:"sat-bhai-champa",cat:"bn",lang:"bn",title:"সাত ভাই চম্পা",emoji:"🌸",color:"#ffdcec",pages:[

{id:"ghumanto-puri",cat:"bn",lang:"bn",title:"ঘুমন্ত পুরী",emoji:"🏰",color:"#e5ddff",pages:[

var home=document.getElementById("home"),reader=document.getElementById("reader"),grid=document.getElementById("grid"),chipsEl=document.getElementById("chips"),cur=null,pg=0,filter="all";
var TTS="speechSynthesis" in window;
if(!TTS)document.getElementById("speak").style.display="none";
function drawGrid(){grid.innerHTML="";BOOKS.forEach(function(b){if(filter!=="all"&&b.cat!==filter)return;
 var el=document.createElement("button");el.className="book";el.lang=b.lang||"en";el.setAttribute("aria-label","Read "+b.title);
 el.innerHTML='<div class="cover" style="background:'+b.color+'">'+b.emoji+'</div><b>'+b.title+'</b>';
 el.onclick=function(){location.hash=b.id};grid.appendChild(el)})}
function drawChips(){chipsEl.innerHTML="";CATS.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c[0]===filter?" on":"");b.textContent=c[1];
 b.onclick=function(){filter=c[0];drawChips();drawGrid()};chipsEl.appendChild(b)})}
function stopSpeech(){if(TTS)speechSynthesis.cancel();document.getElementById("speak").textContent="🔊"}
function speak(){if(!TTS||!cur)return;if(speechSynthesis.speaking){stopSpeech();return}
 var u=new SpeechSynthesisUtterance(cur.pages[pg][1].replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F\u200D\u20E3✨]/gu,""));u.rate=.85;if(cur.lang)u.lang=cur.lang==="bn"?"bn-IN":"hi-IN";u.pitch=1.1;u.onend=function(){document.getElementById("speak").textContent="🔊"};
 document.getElementById("speak").textContent="⏹";speechSynthesis.speak(u)}
function render(){
 stopSpeech();var h=location.hash.replace("#","");cur=BOOKS.filter(function(b){return b.id===h})[0]||null;
 if(!cur){home.style.display="";reader.style.display="none";document.title="Little Story Nook";return}
 home.style.display="none";reader.style.display="flex";document.title=cur.title;pg=0;show()}
function show(){
 stopSpeech();var p=cur.pages[pg],n=cur.pages.length;
 var ti=document.getElementById("title");ti.lang=cur.lang||"en";ti.textContent=cur.title;
 var sc=document.getElementById("scene"),F=p[2]||"";sc.className="scene"+(F.indexOf("n")>-1?" sm":"");sc.textContent=p[0];
 var L=cur.lang||"en",E=({bn:"সমাপ্ত",hi:"समाप्त"})[L]||"The End",tx=document.getElementById("text");tx.lang=L;tx.className="text"+(F.indexOf("l")>-1?" list":"");tx.textContent=p[1]+(pg===n-1?(F?"\n\n":"  ")+"✨ "+E+" ✨":"");
 document.getElementById("prev").disabled=pg===0;
 document.getElementById("next").textContent=pg===n-1?"Library 📚":"Next ▶";
 var d="";for(var i=0;i<n;i++)d+='<i class="'+(i===pg?"on":"")+'"></i>';document.getElementById("dots").innerHTML=d}
function go(d){if(!cur)return;var n=pg+d;if(n>=cur.pages.length){home_();return}if(n<0)return;pg=n;show()}
function home_(){stopSpeech();try{history.replaceState(null,"",location.pathname+location.search)}catch(e){try{location.hash=""}catch(e2){}}render()}
document.getElementById("prev").onclick=function(){go(-1)};
document.getElementById("next").onclick=function(){go(1)};
document.getElementById("back").onclick=home_;
document.getElementById("speak").onclick=speak;
document.addEventListener("keydown",function(e){if(!cur)return;
 if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="Escape"||e.key==="Backspace"){e.preventDefault();home_()}});
var sx=null;reader.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
reader.addEventListener("touchend",function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)go(dx<0?1:-1);sx=null});
window.addEventListener("hashchange",render);window.addEventListener("pagehide",stopSpeech);
drawChips();drawGrid();render();
</script>
