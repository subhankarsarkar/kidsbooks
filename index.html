{"id": "black-panther-jol", "cat": "comics", "lang": "bn", "title": "ব্ল্যাক প্যান্থার ও কুয়ার জল", "emoji": "🐆", "color": "#e0d9ee", "pages": [["🐆👑🌍", "টি’চাল্লা আফ্রিকার ওয়াকান্ডা রাজ্যের রাজা, যিনি ব্ল্যাক প্যান্থার। ওয়াকান্ডায় আছে ভাইব্রেনিয়াম নামের বিশেষ ধাতু আর অনেক আধুনিক বিজ্ঞান।"], ["🏜️💧😟", "প্রতিবেশী এক গ্রামে অনেক দিন বৃষ্টি হয়নি। কুয়া শুকিয়ে গেছে, বাচ্চারা তেষ্টায় কাতর।"], ["🧑‍🔬🛠️💡", "টি’চাল্লার বোন শুরি বলল, “দাদা, আমরা জল পরিষ্কারের যন্ত্র বানিয়ে ওদের দিতে পারি!”"], ["🚚💧🤝", "তারা যন্ত্র আর পাইপ নিয়ে গ্রামে গেল। সবাই মিলে নতুন কুয়া খুঁড়ল আর জল পরিষ্কারের যন্ত্র বসাল।"], ["💦😊🐆", "গ্রামের বাচ্চারা পরিষ্কার জল খেয়ে খুশিতে হেসে উঠল। টি’চাল্লা বললেন, “যা জানি, তা ভাগ করে নিলে সবাই এগিয়ে যায়।”"]]},
{"id": "doctor-strange-andhokar", "cat": "comics", "lang": "bn", "title": "ডক্টর স্ট্রেঞ্জ ও অন্ধকারের ভয়", "emoji": "🧙‍♂️", "color": "#e7dcf7", "pages": [["🧙‍♂️🌀✨", "ডক্টর স্টিফেন স্ট্রেঞ্জ আগে ডাক্তার ছিলেন, পরে শিখলেন জাদু। তাঁর আছে উড়ন্ত লাল আলখাল্লা আর ঝিকমিক জাদুর আলো।"], ["🌙😨🛏️", "ছোট্ট নীলের অন্ধকার ঘরে ঘুম আসে না। তার মনে হয়, দেয়ালের ছায়াটা যেন এক দৈত্য!"], ["🧙‍♂️✨🌟", "ডক্টর স্ট্রেঞ্জ জাদু করে ঘর ভরিয়ে দিলেন নরম সোনালি আলোয়। “এবার ভালো করে দেখো, নীল।”"], ["🪑🧸👀", "আলোয় দেখা গেল, দৈত্যটা আসলে চেয়ারে রাখা কোট আর টেডি বিয়ারের ছায়া!"], ["😄🌙💛", "নীল হেসে ফেলল। ডক্টর স্ট্রেঞ্জ বললেন, “আলো জ্বাললে বেশিরভাগ ভয়ই মিলিয়ে যায়।” তারপর নীল শান্তিতে ঘুমিয়ে পড়ল।"]]},
{"id": "captain-marvel-pilot", "cat": "comics", "lang": "bn", "title": "ক্যাপ্টেন মার্ভেল ও ছোট্ট পাইলট", "emoji": "🚀", "color": "#ffe9c7", "pages": [["🚀⭐👩‍✈️", "ক্যারল ড্যানভার্স একজন সাহসী পাইলট। বিশেষ শক্তি পেয়ে তিনি ক্যাপ্টেন মার্ভেল হয়ে মহাকাশেও উড়তে পারেন।"], ["👧✈️😔", "ছোট্ট মিতা পাইলট হতে চায়। কিন্তু এক বন্ধু বলল, “মেয়েরা বিমান চালাতে পারে না।” মিতার মন খারাপ হয়ে গেল।"], ["✈️🙂⭐", "ক্যাপ্টেন মার্ভেল হেসে বললেন, “আমি তো একজন মেয়ে, আর আমি পাইলট! মেয়েরা সবই পারে।”"], ["💪🔁🌟", "তিনি বললেন, “আমি অনেকবার পড়ে গিয়েছি, কিন্তু প্রতিবার উঠে দাঁড়িয়েছি। তুমিও পারবে।”"], ["🚀💛👧", "মিতা উৎসাহ পেয়ে বিমানের মডেল বানাতে শুরু করল। আকাশের দিকে তাকিয়ে সে হাসল।"]]},
{"id": "green-lantern-sanko", "cat": "comics", "lang": "bn", "title": "গ্রিন ল্যান্টার ও সবুজ সাঁকো", "emoji": "💍", "color": "#d4f5dc", "pages": [["💍💚🚀", "হ্যাল জর্ডন একজন পাইলট। তাঁর আংটি থেকে সবুজ আলো বেরোয়। এই আংটির শক্তি আসে মনের জোর থেকে।"], ["🌧️🌉😰", "বন্যার পর স্কুলের পথের পুরোনো সাঁকোটা নড়বড়ে হয়ে গেছে। ছোট্ট সুমন ভয়ে সেটা পার হতে চাইছে না।"], ["💚🌉✨", "গ্রিন ল্যান্টার আংটির আলো দিয়ে সুন্দর একটা সবুজ সাঁকো বানিয়ে দিলেন। “ওটা ধরে ধরে হাঁটো।”"], ["🧒🚶💪", "সুমন একটু একটু করে এগোল। মাঝখানে এসে সে দেখল, সবুজ আলো ম্লান হয়ে গেছে, তবু সে আর ভয় পাচ্ছে না!"], ["😄💚🏫", "সুমন ওপারে পৌঁছে হেসে উঠল। হ্যাল বললেন, “আংটির শক্তি আসলে তোমারই মনের জোর।” তারপর বড়দের জানিয়ে সাঁকো মেরামতের ব্যবস্থা হলো।"]]},
{"id": "ant-man-angti", "cat": "comics", "lang": "bn", "title": "অ্যান্ট-ম্যান ও দাদির আংটি", "emoji": "🐜", "color": "#ffe0cc", "pages": [["🐜🔬🧑", "স্কট ল্যাং বিশেষ সুট পরে পিঁপড়ের মতো ছোট হয়ে যেতে পারেন, আবার বড়ও হতে পারেন। পিঁপড়েরা তাঁর বন্ধু।"], ["👵💍😢", "দাদির প্রিয় আংটি বাগানের ঘাসের মধ্যে হারিয়ে গেছে। ছোট্ট রুমা অনেক খুঁজেও পেল না।"], ["🐜🔬🌿", "অ্যান্ট-ম্যান ছোট হয়ে পিঁপড়েদের সঙ্গে ঘাসের জঙ্গলে ঢুকলেন। “বন্ধুরা, একটা চকচকে জিনিস খুঁজতে হবে!”"], ["🐜🐜💎", "হাজার হাজার পিঁপড়ে সারি বেঁধে খুঁজতে লাগল। অল্প সময়েই একজন চেঁচিয়ে উঠল, “এই যে!”"], ["💍👵🎉", "আংটিটা পাওয়া গেল পাতার নিচে। অ্যান্ট-ম্যান বললেন, “যা একা কঠিন, দলে মিলে তা সহজ।” দাদি আর রুমা খুশিতে হাসল।"]]},
{"id": "hawkeye-obhyas", "cat": "comics", "lang": "bn", "title": "হকআই ও অভ্যাসের তির", "emoji": "🏹", "color": "#e4e0f7", "pages": [["🏹🎯👨", "ক্লিন্ট বার্টন, যাঁর নাম হকআই, তির-ধনুকে অসাধারণ দক্ষ। কিন্তু এই দক্ষতা তিনি পেয়েছেন প্রতিদিনের অভ্যাসে।"], ["🎪🏹😤", "মেলায় তিরের খেলায় ছোট্ট রাজু বারবার লক্ষ্য মিস করছে। সে রেগে ধনুক ফেলে দিল।"], ["🏹🙂🧘", "হকআই ধনুক তুলে বললেন, “দাঁড়াও, রেগে গেলে হাত কাঁপে। আগে শান্ত হও, বড় করে নিঃশ্বাস নাও।”"], ["👀🎯💪", "“এবার শুধু লক্ষ্যের দিকে তাকাও। কাঁধ, হাত, সব স্থির।” রাজু আবার ধনুক টানল।"], ["🎯🎉🏹", "তির গিয়ে লাগল ঠিক মাঝখানে না হলেও আগের চেয়ে অনেক কাছে! হকআই বললেন, “প্রতিদিনের অভ্যাসই আসল গুপ্তমন্ত্র।”"]]},
{"id": "shazam-notun-bondhu", "cat": "comics", "lang": "bn", "title": "শাজাম ও নতুন বন্ধু", "emoji": "⚡", "color": "#fff3c4", "pages": [["⚡🧒✨", "বিলি ব্যাটসন একজন ছোট ছেলে। “শাজাম!” বলে চেঁচালেই সে শক্তিশালী বীর হয়ে যায়। নামের অক্ষরগুলোতে লুকিয়ে আছে জ্ঞান, শক্তি, সহনশক্তি, ক্ষমতা, সাহস আর গতি।"], ["🏫😔🌍", "নতুন ছাত্র লিও অন্য দেশ থেকে এসেছে। সে ভালো করে ভাষা বলতে পারে না, তাই একা বসে থাকে।"], ["🧒🤝😊", "বিলি তার পাশে গিয়ে বসল। ইশারায় বলল, “চলো, আমরা বন্ধু!” লিও প্রথমবার হাসল।"], ["🎨📖🖍️", "বিলি “শাজাম” বলে বীর হলো, কিন্তু শক্তি দেখাল না। শুধু ছবি এঁকে এঁকে লিওকে নতুন শব্দ শেখাল।"], ["🎉🧒🧒", "কিছুদিনের মধ্যে লিও সবার বন্ধু হয়ে গেল। বিলি বুঝল, সবচেয়ে বড় শক্তি হলো বন্ধুত্ব।"]]},
{"id": "joker-hasi", "cat": "comics", "lang": "bn", "title": "জোকার ও আসল হাসি", "emoji": "🤡", "color": "#f1e0f7", "pages": [["🤡🃏🎪", "জোকার গথাম শহরের এক দুষ্টু রসিক, ব্যাটম্যানের পুরোনো শত্রু। সে ভাবে, মজা মানে কাউকে কষ্ট দেওয়া।"], ["🎈😡😢", "সে মেলায় বাচ্চাদের বেলুন ফাটিয়ে দিল আর হা হা করে হাসল। কিন্তু বাচ্চারা কেউ হাসল না, সবাই কাঁদল।"], ["👧🙂🃏", "ছোট্ট মিনা এগিয়ে এসে বলল, “আসল মজা তো তখন, যখন সবাই একসঙ্গে হাসে!”"], ["🤔😳🎭", "জোকার প্রথমবার ভাবল। সে মনে মনে বলল, “সত্যিই তো, আমার সঙ্গে তো কেউ হাসছে না।”"], ["🎪🎉🤡", "জোকার নতুন বেলুন এনে দিল আর নিরীহ জাদু দেখাল। এবার সবাই হো হো করে হেসে উঠল। আসল হাসি সেটাই, যেখানে সবাই খুশি হয়।"]]},
{"id": "venom-sandwich", "cat": "comics", "lang": "bn", "title": "ভেনম ও ভাগের স্যান্ডউইচ", "emoji": "🥪", "color": "#d9d9e8", "pages": [["🕷️🖤👾", "ভেনম এক কালো, আঠালো, গ্রহান্তরের প্রাণী, যে মানুষের শরীরে লেগে যেতে পারে। সে সবসময় বিরক্ত আর খিদেয় কাতর।"], ["🥪😠🏞️", "পার্কে ছোট্ট অনু স্যান্ডউইচ খাচ্ছিল। ভেনম গর্জে বলল, “দাও ওটা, আমার খিদে পেয়েছে!”"], ["😨🥪🙂", "অনু ভয় পেলেও আস্তে বলল, “ভদ্রভাবে চাইলে আমি ভাগ করে দিতাম।”"], ["🥪🤲😳", "অনু স্যান্ডউইচের অর্ধেকটা ভেনমের হাতে দিল। এমন করে কেউ ভেনমকে কিছু দেয়নি আগে। সে থতমত খেয়ে গেল।"], ["😌💛🖤", "ভেনমের রাগ কমে গেল। সে নরম গলায় বলল, “ধন্যবাদ।” ভদ্র কথায় আর ভাগ করে নেওয়ায় সব বিরক্তি গলে যায়।"]]},
{"id": "thanos-mishti", "cat": "comics", "lang": "bn", "title": "থ্যানোস ও মিষ্টির গুদাম", "emoji": "🍬", "color": "#e9d9f5", "pages": [["🟣💎🧤", "থ্যানোস এক শক্তিশালী মহাকাশের দানব। সে চকচকে ইনফিনিটি পাথর জোগাড় করে সব কিছু নিজের করে নিতে চেয়েছিল।"], ["🍬😤🪐", "লোভী থ্যানোস গ্রহের সব মিষ্টি নিজের গুদামে জমা করে রাখল। অন্য বাচ্চারা একটাও পেল না।"], ["🧒😢🍭", "এক ছোট্ট ছেলে এসে বলল, “আমরা একটা মিষ্টিও পাইনি। তুমি এত মিষ্টি দিয়ে কী করবে?”"], ["🤔🍬🍬", "থ্যানোস ভাবল, সত্যিই তো, সে নিজে অতগুলো মিষ্টি কখনও খেতে পারবে না। অর্ধেক মিষ্টি তো নষ্টই হতে বসেছিল।"], ["🎉🍭🟣", "সে সব মিষ্টি বাচ্চাদের বিলিয়ে দিল। সবাই খুশিতে হাততালি দিল। থ্যানোস বুঝল, লোভের চেয়ে ভাগ করে নেওয়ার আনন্দ অনেক বড়।"]]},
{"id": "loki-hatuir", "cat": "comics", "lang": "bn", "title": "লোকি ও হারানো হাতুড়ি", "emoji": "🐍", "color": "#d9f0e3", "pages": [["🐍🎭⚡", "লোকি আসগার্ডের দুষ্টুমির দেবতা, থরের ভাই। সে জাদু করে চেহারা পাল্টাতে আর মজার চালাকি করতে ভালোবাসে।"], ["🔨🙈😏", "একদিন মজা করে সে থরের হাতুড়িটা লুকিয়ে ফেলল। থর সারাদিন খুঁজে খুঁজে হয়রান।"], ["😢🌩️🏰", "থর মন খারাপ করে বসে রইল। হাতুড়ি ছাড়া সে বজ্র ডাকতে পারছিল না, আসগার্ডের আকাশে মেঘ জমল।"], ["🐍😳🙏", "লোকি দেখল, তার মজা সবার মন খারাপ করে দিয়েছে। সে লজ্জা পেয়ে হাতুড়ি ফিরিয়ে দিয়ে বলল, “ভাই, ক্ষমা করো।”"], ["🤝⚡🎉", "থর হেসে ভাইকে জড়িয়ে ধরল। লোকি বলল, “মজা করা ভালো, তবে সে মজায় যেন কেউ কষ্ট না পায়।”"]]},
{"id": "daredevil-shobdo", "cat": "comics", "lang": "bn", "title": "ডেয়ারডেভিল ও শব্দের পথ", "emoji": "👂", "color": "#ffd9d9", "pages": [["🔴👨‍⚖️👂", "ম্যাট মার্ডক ছোটবেলায় এক দুর্ঘটনায় চোখের দৃষ্টি হারিয়েছিলেন, কিন্তু তাঁর কান, নাক আর স্পর্শের শক্তি অসাধারণ হয়ে ওঠে। তিনি আইনজীবী, আর রাতে ডেয়ারডেভিল।"], ["🏙️🔊👦", "ব্যস্ত শহরের ভিড়ে ছোট্ট অর্ণব মায়ের হাত ছেড়ে ফেলল। সে ভয়ে কাঁদছে, কিন্তু ভিড়ের শব্দে কেউ শুনতে পাচ্ছে না।"], ["👂🙂🚶", "ম্যাট হাজার শব্দের মধ্যেও সেই ছোট্ট কান্না শুনতে পেলেন। তিনি সাদা ছড়ি হাতে ধীরে ধীরে সেদিকে এগোলেন।"], ["🤝👦💛", "তিনি অর্ণবের হাত ধরে বললেন, “আমি চোখে দেখি না, কিন্তু তোমাকে শুনতে পাচ্ছি। চলো, মাকে খুঁজি।”"], ["👩‍👦🎉🔴", "ঘোষণা শুনে মা ছুটে এলেন। ম্যাট বললেন, “কোনো অভাবই তোমাকে থামাতে পারে না, যদি মনের জোর থাকে।”"]]},
{"id": "green-arrow-khabar", "cat": "comics", "lang": "bn", "title": "গ্রিন অ্যারো ও খাবারের ঝুড়ি", "emoji": "🥬", "color": "#d9f2d0", "pages": [["🏹💚🌲", "অলিভার কুইন ধনী ঘরের ছেলে, যে গ্রিন অ্যারো হয়ে স্টার শহর রক্ষা করে। সে রবিন হুডের মতো গরিবদের সাহায্য করে।"], ["🏙️🍞😢", "শীতের দিনে শহরের কিছু বাচ্চার ঘরে খাবার ছিল না। তারা শীতে কাঁপছিল।"], ["🏹🍞📦", "গ্রিন অ্যারো তিরের সঙ্গে দড়ি বেঁধে দূরের ছাদে খাবারের থলে পৌঁছে দিল।"], ["👧👦🤝", "শহরের বাচ্চারা বলল, “আমরাও আমাদের বাড়তি খাবার আর পুরোনো জামা দেব!” সবাই মিলে একটা দানের ভাণ্ডার খুলল।"], ["💚🎉🍞", "কোনো বাচ্চা আর খালি পেটে ঘুমোল না। অলিভার বললেন, “তোমার কাছে যা আছে, তা থেকে কিছুটা অন্যকে দাও।”"]]},
{"id": "robin-digbaji", "cat": "comics", "lang": "bn", "title": "রবিন ও ডিগবাজির ভয়", "emoji": "🐦", "color": "#ffe0e0", "pages": [["🐦🔴🤸", "ডিক গ্রেসন ছোটবেলায় সার্কাসে দোলনার খেলা দেখাত। পরে সে ব্যাটম্যানের সঙ্গী রবিন হয়ে ওঠে।"], ["🎪😰🤸", "সার্কাসের ছোট্ট ছেলে রিঙ্কু ডিগবাজি দিতে ভয় পাচ্ছে। সে বারবার পিছিয়ে যায়।"], ["🐦🙂🤝", "রবিন তার পাশে এসে বলল, “আমিও প্রথমে ভয় পেতাম, ধীরে ধীরে শিখেছি।”"], ["🤸‍♂️🧸🛏️", "রবিন একটা নরম গদি বিছিয়ে দিল। “আগে এখানে চেষ্টা করো, পড়লেও ব্যথা পাবে না।”"], ["🎉👏🤸", "রিঙ্কু প্রথমে পড়ল, তারপর আবার চেষ্টা করল, আর শেষে সুন্দর ডিগবাজি দিল! রবিন বলল, “অভ্যাস আর বন্ধুর উৎসাহ থাকলে সবই সম্ভব।”"]]},
{"id": "supergirl-notun-school", "cat": "comics", "lang": "bn", "title": "সুপারগার্ল ও নতুন স্কুল", "emoji": "🦸‍♀️", "color": "#ffdce8", "pages": [["🦸‍♀️🌍🚀", "কারা, যাঁর নাম সুপারগার্ল, সুপারম্যানের খুড়তুতো বোন। সে ক্রিপ্টন গ্রহ থেকে পৃথিবীতে এসেছে আর আকাশে উড়তে পারে।"], ["🏫😔🌎", "নতুন স্কুলে কারা একা। সব কিছু নতুন, কেউ তাকে চেনে না। তার মনে হচ্ছে সে এখানকার কেউ নয়।"], ["👧🍪🙂", "ক্লাসের মেয়ে নন্দিনী এসে বলল, “তুমি আমার সঙ্গে টিফিন খাবে?” কারার মুখে প্রথমবার হাসি ফুটল।"], ["🎨🤝🌈", "দুজনে মিলে ছবি আঁকল, গল্প করল। কারা শিখল, নতুন জায়গাতেও বন্ধু পাওয়া যায়।"], ["🦸‍♀️💛🏫", "কারা আকাশে উড়ে গেলেও রোজ ঠিক স্কুলে ফিরে আসে। সে এখন জানে, বন্ধু থাকলে যেকোনো জায়গাই নিজের বাড়ি হয়ে যায়।"]]},
{"id": "heman-battle-cat", "cat": "comics", "lang": "bn", "title": "হি-ম্যান ও ভীতু বাঘ", "emoji": "⚔️", "color": "#d9e6ff", "pages": [["⚔️💪🏰", "ইটার্নিয়ার রাজকুমার অ্যাডাম জাদুর তলোয়ার তুলে ধরলে হয়ে যান শক্তিশালী হি-ম্যান। তাঁর রহস্যময় ঘাঁটির নাম গ্রেস্কাল দুর্গ।"], ["🐱😨🌳", "অ্যাডামের পোষা ভীতু বাঘ ক্রিংগার সামান্য শব্দেই ভয় পায়। সে সবসময় গাছের পেছনে লুকিয়ে থাকে।"], ["💀😈🎁", "দুষ্টু স্কেলেটর গ্রামের শিশুদের লোভ দেখিয়ে ডাকল। হি-ম্যানের বন্ধু টিলা বলল, “সবাই সাবধান! ওর চালাকি বুঝতে হবে!”"], ["🐯⚡🛡️", "তখন ক্রিংগার সাহস করে লাফ দিয়ে সামনে এল। জাদুর আলোয় সে হয়ে গেল ব্যাটল ক্যাট, বিশাল সাহসী বাঘ।"], ["🎉💛⚔️", "স্কেলেটর পালাল, শিশুরা বাঁচল। হি-ম্যান বললেন, “সাহস হঠাৎ আসে না, ধীরে ধীরে বাড়ে। আজ ক্রিংগার তা প্রমাণ করল।”"]]},
{"id": "shaktimaan-nodi", "cat": "comics", "lang": "bn", "title": "শক্তিমান ও পরিষ্কার নদী", "emoji": "🌀", "color": "#fff0c2", "pages": [["🌀🌟🧘", "শক্তিমান ভারতের দূরদর্শনের এক জনপ্রিয় ধারাবাহিকের বীর। সাধারণ সময়ে তিনি সাদাসিধে গঙ্গাধর, বিপদ এলে ঘুরপাক খেয়ে শক্তিমান হয়ে যান।"], ["🏞️🗑️😟", "নদীর ধারে বাচ্চারা খেলতে এসে চিপসের প্যাকেট আর বোতল ফেলে চলে যাচ্ছে।"], ["📰🙂🌀", "সাংবাদিক গীতা বিশ্বাস ছবি তুলে বলল, “এভাবে নদী নোংরা হয়ে যাবে, কেউ কি কিছু করবে?” গঙ্গাধর চুপিচুপি আড়ালে গিয়ে ঘুরতে লাগলেন।"], ["🌀🌟🧹", "ঘুরপাক খেয়ে শক্তিমান হাজির! এক পলকে তিনি সব আবর্জনা কুড়িয়ে ঝুড়িতে ভরে ফেললেন।"], ["🧒🌿👏", "শক্তিমান বললেন, “বাচ্চারা, আজ থেকে আবর্জনা ঝুড়িতেই ফেলবে। নদী আমাদের বন্ধু, তাকে পরিষ্কার রাখো।” সবাই প্রতিজ্ঞা করল।"]]},
{"id": "krrish-circus", "cat": "comics", "lang": "bn", "title": "ক্রিশ ও সার্কাসের তার", "emoji": "🎪", "color": "#ffe4d4", "pages": [["🎭🏃‍♂️🌟", "ক্রিশ ভারতের এক জনপ্রিয় সিনেমার সুপারহিরো। সাধারণ সময়ে সে সার্কাসে খেলা দেখানো ছেলে কৃষ্ণা, কিন্তু বিপদে মুখোশ পরে হয়ে যায় ক্রিশ।"], ["🎪🧗‍♀️😨", "সার্কাসে ছোট্ট একটি মেয়ে উঁচু তারের ওপর হাঁটতে গিয়ে ভয় পেয়ে মাঝখানে থেমে গেল।"], ["👩‍💼📞🆘", "সাংবাদিক প্রিয়া চেঁচিয়ে বলল, “কেউ সাহায্য করো!” কৃষ্ণা মুখোশ পরে ক্রিশ হয়ে ছুটে গেল।"], ["🤸‍♂️💨🧗", "ক্রিশ বিদ্যুতের মতো উঠে তারের ওপর দিয়ে হেঁটে মেয়েটির কাছে গেল। আলতো করে তাকে ধরে বলল, “আমার দিকে তাকাও, নিচে নয়।”"], ["🎉👏🎪", "দুজনে ধীরে ধীরে নিরাপদে নেমে এল। ক্রিশ বলল, “ভয় লাগলে কারও হাত ধরো, আর সামনের দিকে তাকাও।”"]]},
{"id": "ram-bonobash", "cat": "epic", "lang": "bn", "title": "রাম ও দেওয়া কথা", "emoji": "🏹", "color": "#fff1cc", "pages": [["🏰👑🌅", "অযোধ্যার রাজা দশরথের বড় ছেলে রাম। সবাই তাঁকে ভালোবাসত, কারণ তিনি ছিলেন সৎ, দয়ালু আর বাবা-মায়ের বাধ্য।"], ["🎉🤴😊", "একদিন ঠিক হলো, রামকে রাজা করা হবে। অযোধ্যায় আনন্দের উৎসব শুরু হলো।"], ["😢📜🌿", "কিন্তু রানি কৈকেয়ীকে দেওয়া দশরথের পুরোনো এক প্রতিশ্রুতির কারণে রামকে চোদ্দো বছর বনে যেতে হবে। দশরথ খুব দুঃখ পেলেন।"], ["🤴🙂🙏", "রাম একটুও রাগ না করে হেসে বললেন, “বাবা, আপনার কথা রাখাই আমার ধর্ম।” তিনি রাজপোশাক ছেড়ে বনের পোশাক পরলেন।"], ["👫🌲💛", "সীতা আর ভাই লক্ষ্মণও তাঁর সঙ্গে বনে গেলেন। রামের কাছ থেকে আমরা শিখি, দেওয়া কথা রাখতে হয়, আর বড়দের সম্মান করতে হয়।"]]},
{"id": "krishna-govardhan", "cat": "epic", "lang": "bn", "title": "কৃষ্ণ ও গোবর্ধন পর্বত", "emoji": "🪈", "color": "#d6ecff", "pages": [["🪈🐄🌿", "বৃন্দাবনের ছোট্ট কৃষ্ণ গরু চরাতেন আর বাঁশি বাজাতেন। গ্রামের সবাই তাঁকে খুব ভালোবাসত।"], ["⛈️😰🏘️", "একবার দেবরাজ ইন্দ্র রেগে গিয়ে প্রচণ্ড ঝড়বৃষ্টি শুরু করলেন। গ্রামের লোকেরা ভয় পেয়ে গেল।"], ["⛰️👆🙂", "কৃষ্ণ হেসে এক আঙুলে গোবর্ধন পর্বত তুলে ধরলেন। “সবাই এর নিচে এসে আশ্রয় নাও!”"], ["🐄👧👦", "গ্রামের মানুষ, গরু আর বাচ্চারা সবাই পাহাড়ের নিচে নিরাপদে রইল। কথিত আছে, কৃষ্ণ সাত দিন ধরে এভাবে পাহাড় ধরে রেখেছিলেন।"], ["🌈💙🪈", "ইন্দ্রের অহংকার ভেঙে গেল, তিনি ক্ষমা চাইলেন। কৃষ্ণ শেখালেন, অহংকার নয়, সবার পাশে দাঁড়ানোই আসল ধর্ম।"]]},
{"id": "harishchandra-satya", "cat": "epic", "lang": "bn", "title": "রাজা হরিশচন্দ্র ও সত্যের পথ", "emoji": "⚖️", "color": "#fff4d2", "pages": [["👑🌟📜", "রাজা হরিশচন্দ্র ছিলেন অযোধ্যার এক মহান রাজা। তিনি কখনও মিথ্যা বলতেন না, আর কথা দিলে তা রাখতেন।"], ["🧙‍♂️🎁🏰", "একদিন ঋষি বিশ্বামিত্র তাঁর কাছে এলেন। রাজা তাঁকে দান দেবেন বলে কথা দিলেন, আর সে কথা রাখতে নিজের রাজ্যও দিয়ে দিলেন।"], ["🚶‍♂️👩👦🌾", "রাজ্য ছেড়ে রাজা, রানি শৈব্যা আর ছেলে রোহিতাশ্ব সাধারণ মানুষের মতো কঠিন জীবনে কাটালেন। তবু রাজা সত্য ছাড়েননি।"], ["🌟🙏⚖️", "দেবতারা তাঁর সত্যনিষ্ঠা দেখে মুগ্ধ হলেন। শেষে সব পরীক্ষায় তিনি জয়ী হলেন।"], ["🏰🎉💛", "রাজা আবার রাজ্য ফিরে পেলেন। হরিশচন্দ্রের গল্প আমাদের শেখায়, সত্য বলা আর প্রতিজ্ঞা রাখা সবচেয়ে বড় সম্পদ।"]]},
{"id": "ashoka-doya", "cat": "epic", "lang": "bn", "title": "সম্রাট অশোক ও দয়ার পথ", "emoji": "☸️", "color": "#fbe9c8", "pages": [["👑🏰🐘", "সম্রাট অশোক প্রাচীন ভারতের মৌর্য বংশের এক শক্তিশালী রাজা। তিনি বিশাল রাজ্য শাসন করতেন।"], ["⚔️😢🌊", "কলিঙ্গ যুদ্ধে অনেক মানুষের কষ্ট দেখে অশোকের মন ভীষণ কেঁদে উঠল। তিনি ঠিক করলেন, আর যুদ্ধ নয়।"], ["🧘‍♂️☸️🕊️", "তিনি বুদ্ধের শান্তি আর দয়ার পথ গ্রহণ করলেন। বললেন, “এখন থেকে আমি ধর্ম আর ভালোবাসা দিয়ে রাজ্য চালাব।”"], ["🌳💧🏥", "অশোক পথের ধারে গাছ লাগালেন, কুয়া খুঁড়লেন, বিশ্রামঘর বানালেন, আর মানুষ ও পশুর চিকিৎসার ব্যবস্থা করলেন।"], ["🦁☸️🇮🇳", "অশোকের সারনাথের সিংহস্তম্ভ আর অশোকচক্র আজও ভারতের জাতীয় প্রতীক ও পতাকায় দেখা যায়। তিনি শিখিয়েছেন, দয়াই সবচেয়ে বড় শক্তি।"]]},
{"id": "shanku-newton", "cat": "adventure", "lang": "bn", "title": "প্রফেসর শঙ্কু ও হারানো নিউটন", "emoji": "🔬", "color": "#dff0ff", "pages": [["🔬🏡🐈", "প্রফেসর ত্রিলোকেশ্বর শঙ্কু একজন বিখ্যাত বৈজ্ঞানিক। তিনি থাকেন গিরিডিতে, উশ্রী নদীর ধারে, আর নতুন নতুন যন্ত্র আবিষ্কার করেন। তাঁর আদরের বিড়ালের নাম নিউটন।"], ["😿🔍🏠", "একদিন সকালে নিউটন হঠাৎ উধাও! প্রফেসর আর তাঁর সহকারী প্রহ্লাদ সারা বাড়ি খুঁজেও তাকে পেলেন না।"], ["💡⚙️🧪", "শঙ্কু ল্যাবরেটরিতে বসে বললেন, “আমি এমন একটা যন্ত্র বানাব, যা কাছাকাছি সব ছোট শব্দ ধরতে পারে।” কয়েক ঘণ্টার মধ্যেই যন্ত্র তৈরি হয়ে গেল।"], ["📡🔊🐾", "যন্ত্র চালু করতেই ক্ষীণ ‘মিউ মিউ’ শব্দ শোনা গেল। শব্দটা আসছে বাড়ির পুরোনো চিলেকোঠা থেকে!"], ["📦🐈😴", "প্রফেসর আর প্রহ্লাদ সিঁড়ি বেয়ে উঠে দেখলেন, একটা পুরোনো কাঠের বাক্সের ভেতর নিউটন গুটিসুটি মেরে ঘুমোচ্ছে।"], ["🎉🔬💛", "প্রহ্লাদ হেসে বললেন, “এত বড় আবিষ্কার শেষে বিড়াল খুঁজতে!” প্রফেসর বললেন, “বিজ্ঞান মানে প্রশ্ন করা আর সমাধান খোঁজা। ছোট সমস্যাতেও তা কাজে লাগে।”"]]},
{"id": "tarzan-jane-boi", "cat": "adventure", "lang": "bn", "title": "টারজান ও জেনের ছবির বই", "emoji": "🌴", "color": "#d8f5d0", "pages": [["🌴🦍🧑", "টারজান আফ্রিকার গভীর জঙ্গলে বড় হয়েছে। ছোটবেলায় বাবা-মাকে হারালে কালা নামের এক মা-বনমানুষ তাকে নিজের ছেলের মতো মানুষ করেছিল।"], ["👩📚🌴", "একদিন জেন পোর্টার নামের এক মেয়ে জঙ্গলে এল। তার ঝোলায় ছিল রঙিন ছবির বই।"], ["🧒👀📖", "টারজান আগে কখনও বই দেখেনি। সে অবাক হয়ে ছবির পাখি, হাতি আর গাছ ছুঁয়ে দেখল।"], ["👩☝️🗣️", "জেন ছবির পাশের শব্দে আঙুল রেখে পড়ে শোনাল, “বন্ধু।” টারজান ধীরে ধীরে নিজেও বলল, “ব… ন্ ধু।”"], ["🐒🐘🥰", "পাশে বসে বানর-বন্ধু চিতা হাততালি দিল। হাতি-বন্ধু টানটরও সুঁড় দুলিয়ে আনন্দ জানাল।"], ["🌴💛📚", "টারজান জোরে বলল, “বন্ধু!” সবাই খুশি হয়ে হেসে উঠল। কিছুদিনের মধ্যে সে আরও অনেক শব্দ শিখে ফেলল। জানতে চাওয়ার ইচ্ছাই সবচেয়ে বড় শক্তি।"]]},
{"id": "tarini-khuro-chhata", "cat": "adventure", "lang": "bn", "title": "তারিণী খুড়ো ও ছাতার গল্প", "emoji": "☂️", "color": "#fff0d0", "pages": [["👴📖☔", "কলকাতার কলেজ স্ট্রিটের কাছে বেনিয়াটোলা লেনে থাকেন তারিণী খুড়ো। তিনি অবিবাহিত, বয়স্ক, আর তাঁর ঝুলিতে সবসময় মজার মজার অভিযানের গল্প।"], ["🏠🧒🍪", "পালতুর বাড়িতে আজ সন্ধ্যায় খুড়ো এসেছেন। বন্ধুরা সবাই চা-বিস্কুট নিয়ে গোল হয়ে বসে বলল, “খুড়ো, নতুন গল্প বলুন!”"], ["🌲🐯😮", "খুড়ো শুরু করলেন, “একবার এক জঙ্গলের পথে হেঁটে যাচ্ছি, হঠাৎ সামনে এক বিশাল বাঘ!” বাচ্চারা দম বন্ধ করে শুনল।"], ["☂️💥😳", "“আমার হাতে ছিল শুধু একটা ছাতা। ভাবলাম, কী করি? ঠিক তখনই খট করে ছাতাটা খুলে ফেললাম, ফটাস!”"], ["🐯💨🏃", "“বাঘ ভাবল, এ আবার কী দানব! সে লেজ গুটিয়ে এক দৌড়ে বনের ভেতর পালিয়ে গেল।”"], ["😄👴🎉", "বাচ্চারা হেসে হাততালি দিল। খুড়ো মুচকি হেসে বললেন, “বিপদে মাথা ঠান্ডা রাখলে বুদ্ধি খুলে যায়।” গল্পটা সত্যি না বানানো, তা কেউ আর জিজ্ঞেস করল না!"]]},
{"id": "nonte-phonte-chashma", "cat": "comics", "lang": "bn", "title": "নন্টে-ফন্টে ও হারানো চশমা", "emoji": "👓", "color": "#e0f0ff", "pages": [["🏫👦👦😜", "নন্টে আর ফন্টে হোস্টেলের দুই দুষ্টু বন্ধু। তারা সারাক্ষণ মজার মজার দুষ্টুমির ফন্দি আঁটে, আর তাদের কাণ্ডে হোস্টেলের সুপারিনটেনডেন্ট মশাই প্রায়ই নাজেহাল হন।"], ["👓🙈😏", "একদিন সকালে নন্টে বলল, “চল, সুপারের চশমাটা লুকিয়ে দিই!” ফন্টে হেসে রাজি হয়ে গেল। দুজনে চশমা বালিশের নিচে লুকিয়ে ফেলল।"], ["📩😟🔍", "সুপার মশাইয়ের একটা জরুরি চিঠি পড়ার ছিল, কিন্তু চশমা নেই! তিনি ঘর তোলপাড় করে খুঁজতে লাগলেন।"], ["😰🤝👦", "নন্টে-ফন্টে দেখল, তিনি ভীষণ দুশ্চিন্তায় পড়েছেন। ফন্টে ফিসফিস করে বলল, “আমাদের মজা তো ওঁর কষ্টের কারণ হয়ে গেল!”"], ["🙏👓😳", "দুজনে ছুটে গিয়ে চশমা ফেরত দিয়ে বলল, “স্যার, আমরাই লুকিয়েছিলাম। আমাদের ক্ষমা করবেন।”"], ["🌿😊🎉", "সুপার মশাই একটু হেসে বললেন, “সত্যি বলেছ বলে খুশি। এবার বাগানের গাছে জল দাও।” দুজনে মন দিয়ে কাজ করল। মজা করা ভালো, কিন্তু যেন কেউ কষ্ট না পায়।"]]},
{"id": "handa-bhonda-porikkha", "cat": "comics", "lang": "bn", "title": "হাঁদা-ভোঁদা ও পরীক্ষার আগের রাত", "emoji": "📚", "color": "#fff1d6", "pages": [["👦👦🏠", "হাঁদা আর ভোঁদা দুই বন্ধু। দুজনেই একটু হাঁদা, কিন্তু মনের দিক থেকে ভালো। তাদের কাণ্ড দেখে বাড়ির বড়রা প্রায়ই মাথায় হাত দেন।"], ["🪁☀️😆", "পরীক্ষার আগের দিন বিকেলে দুজনে পড়া ফেলে ঘুড়ি ওড়াতে বেরিয়ে গেল। সারা বিকেল তারা খেলায় মেতে রইল।"], ["🌙📚😱", "রাতে বই খুলতেই দুজনের মাথায় হাত! একটাও পড়া হয়নি। হাঁদা বলল, “এখন কী হবে?”"], ["📝🤔😏", "ভোঁদা বলল, “চল, ছোট কাগজে উত্তর লিখে নিয়ে যাই!” কিন্তু হাঁদা মাথা নেড়ে বলল, “না রে, চুরি করা ঠিক নয়। তার চেয়ে এখনই বসে পড়ি।”"], ["🕯️📖🤝", "দুজনে মিলে বসে একসঙ্গে পড়তে লাগল। একজন প্রশ্ন করে, অন্যজন উত্তর দেয়। রাত কেটে গেল পড়ার মধ্যে।"], ["🏫✅🎉", "পরদিন পরীক্ষা ভালোই হলো। হাঁদা-ভোঁদা শিখল, নিজে পড়লেই আসল আনন্দ, আর সময়মতো পড়া করলে শেষ রাতের ভয় থাকে না।"]]},
{"id": "bantul-kada-gari", "cat": "comics", "lang": "bn", "title": "বাঁটুল দি গ্রেট ও কাদায় আটকানো গাড়ি", "emoji": "💪", "color": "#ffe6d0", "pages": [["💪🌟🏘️", "বাঁটুল দি গ্রেট বাংলা কমিকসের এক অসম্ভব শক্তিশালী বীর। তার গায়ে এত জোর যে সে ভারী ভারী জিনিস অনায়াসে তুলে ফেলতে পারে।"], ["🌧️🛻🧱", "এক বর্ষার দিনে গ্রামের পথে কাদায় একটা মালবোঝাই গাড়ি আটকে গেল। গাড়িতে ছিল ছোটদের স্কুলের বই আর খাতা।"], ["😟📚🕰️", "চালক আর বাচ্চারা সবাই মিলে ঠেলল, কিন্তু চাকা এক চুলও নড়ল না। স্কুলের সময় হয়ে আসছে।"], ["💪😄🛻", "বাঁটুল হাসতে হাসতে এসে বলল, “সরো সরো, আমি দেখছি!” সে এক হাতে গাড়ির পেছনটা ধরে এক ঠেলায় তুলে দিল।"], ["🛻🎉👏", "গাড়ি কাদা থেকে বেরিয়ে এল! বাচ্চারা আনন্দে হাততালি দিল। চালক বললেন, “ধন্যবাদ বাঁটুল!”"], ["💪💛🏫", "বাঁটুল বলল, “শক্তি থাকলে তা অন্যের কাজে লাগাতে হয়।” তারপর সে বাচ্চাদের সঙ্গে স্কুল পর্যন্ত বইয়ের বোঝা বয়ে দিয়ে এল।"]]},
{"id": "animals10-en", "cat": "animals", "title": "10 Amazing Animals", "emoji": "🐘", "color": "#ffe9c7", "pages": [["🐘", "1. Elephant\nThe biggest animal that lives on land! It uses its long trunk to drink water, smell and pick up food. Its big ears help it stay cool."], ["🦁", "2. Lion\nLions live in groups called prides. Male lions have a big fluffy mane. Most live in Africa, and a few live in the Gir forest in India."], ["🐯", "3. Tiger\nThe biggest wild cat in the world. Every tiger has its own special stripes. The Royal Bengal Tiger is the national animal of India and Bangladesh, and lives in the Sundarbans."], ["🦒", "4. Giraffe\nThe tallest animal on Earth. Its neck is very long, but it has just seven neck bones, the same number as you!"], ["🦓", "5. Zebra\nZebras wear black and white stripes. No two zebras have exactly the same pattern, just like our fingerprints. They live in herds in Africa."], ["🐒", "6. Monkey\nMonkeys are clever and love to climb trees and eat fruits. They use their hands much like we do. A group of monkeys is called a troop."], ["🐼", "7. Panda\nGiant pandas live in China. They eat bamboo for most of the day, and they sleep a lot too!"], ["🦘", "8. Kangaroo\nKangaroos live in Australia and hop on strong back legs. A mother kangaroo carries her baby, called a joey, in a pouch."], ["🐬", "9. Dolphin\nDolphins live in the sea but they are not fish. They breathe air through a hole on top of their head, and they talk to each other with clicks and whistles."], ["🐫", "10. Camel\nCamels live in deserts. Their humps store fat for energy, and they can walk for many days with little water. Long eyelashes keep sand out of their eyes."]]},
{"id": "animals10-bn", "cat": "animals", "title": "১০টি মজার প্রাণী", "emoji": "🐘", "color": "#ffe9c7", "pages": [["🐘", "১. হাতি\nহাতি স্থলের সবচেয়ে বড় প্রাণী। লম্বা শুঁড় দিয়ে সে জল খায়, গন্ধ শোঁকে আর খাবার তোলে। তার বড় বড় কান শরীর ঠান্ডা রাখতে সাহায্য করে।"], ["🦁", "২. সিংহ\nসিংহরা দল বেঁধে থাকে, সেই দলকে বলে প্রাইড। পুরুষ সিংহের গলায় থাকে বিশাল কেশর। বেশিরভাগ সিংহ আফ্রিকায় থাকে, আর কিছু আছে ভারতের গির বনে।"], ["🐯", "৩. বাঘ\nবাঘ পৃথিবীর সবচেয়ে বড় বুনো বিড়াল। প্রত্যেক বাঘের গায়ের ডোরাকাটা দাগ আলাদা। রয়েল বেঙ্গল টাইগার ভারত ও বাংলাদেশের জাতীয় পশু, আর সে থাকে সুন্দরবনে।"], ["🦒", "৪. জিরাফ\nজিরাফ পৃথিবীর সবচেয়ে লম্বা প্রাণী। তার গলা অনেক লম্বা, কিন্তু গলায় হাড় আছে মাত্র সাতটি, ঠিক তোমার মতোই!"], ["🦓", "৫. জেব্রা\nজেব্রার গায়ে সাদা-কালো ডোরা। দুটি জেব্রার ডোরা ঠিক একরকম হয় না, যেমন আমাদের আঙুলের ছাপ। তারা আফ্রিকায় দল বেঁধে থাকে।"], ["🐒", "৬. বানর\nবানর খুব চালাক, গাছে চড়তে আর ফল খেতে ভালোবাসে। সে আমাদের মতো হাত দিয়ে জিনিস ধরে। একদল বানরকে বলে ট্রুপ।"], ["🐼", "৭. পান্ডা\nজায়ান্ট পান্ডা থাকে চীন দেশে। দিনের বেশিরভাগ সময় সে বাঁশ খায়, আর অনেকক্ষণ ঘুমোয়।"], ["🦘", "৮. ক্যাঙ্গারু\nক্যাঙ্গারু থাকে অস্ট্রেলিয়ায়, শক্তিশালী পেছনের পায়ে লাফিয়ে চলে। মা-ক্যাঙ্গারু তার বাচ্চাকে, যার নাম জোই, পেটের থলিতে বয়ে বেড়ায়।"], ["🐬", "৯. ডলফিন\nডলফিন সমুদ্রে থাকে, কিন্তু মাছ নয়। সে মাথার ওপরের ছিদ্র দিয়ে বাতাসে শ্বাস নেয়, আর শিস ও খটখট শব্দে নিজেদের মধ্যে কথা বলে।"], ["🐫", "১০. উট\nউট মরুভূমিতে থাকে। তার কুঁজে জমানো থাকে চর্বি, যা শক্তি জোগায়, আর সে অল্প জলে অনেক দিন হাঁটতে পারে। লম্বা চোখের পাতা তার চোখে বালি ঢুকতে দেয় না।"]], "lang": "bn"},
{"id": "birds10-en", "cat": "animals", "title": "10 Beautiful Birds", "emoji": "🦜", "color": "#d8f1ff", "pages": [["🦜", "1. Parrot\nParrots have bright feathers and a strong curved beak. Some parrots can copy human words!"], ["🦚", "2. Peacock\nThe peacock is the national bird of India. The male spreads his beautiful, colourful tail feathers like a big fan."], ["🦉", "3. Owl\nOwls have big eyes and hunt at night. They can turn their heads almost all the way around, and they fly very quietly."], ["🦅", "4. Eagle\nEagles can spot tiny things from very far away. They have strong claws and build huge nests high up on trees or cliffs."], ["🐧", "5. Penguin\nPenguins cannot fly, but they are great swimmers! Their wings work like flippers. Many live in icy places like Antarctica."], ["🦆", "6. Duck\nDucks have waterproof feathers and webbed feet that help them paddle. They say ‘quack quack’!"], ["🦩", "7. Flamingo\nFlamingos get their pink colour from the tiny food they eat. They often stand on just one leg to rest."], ["🦢", "8. Swan\nSwans glide gracefully on lakes with their long, curvy necks. Swan pairs often stay together for many years."], ["🐦‍⬛", "9. Crow\nCrows are very clever birds. They can solve puzzles and remember human faces."], ["🐦", "10. Sparrow\nSparrows are tiny birds that live near our homes and chirp in groups. World Sparrow Day is on 20 March."]]},
{"id": "birds10-bn", "cat": "animals", "title": "১০টি সুন্দর পাখি", "emoji": "🦜", "color": "#d8f1ff", "pages": [["🦜", "১. তোতাপাখি\nতোতাপাখির পালক রঙিন আর ঠোঁট শক্ত ও বাঁকা। কিছু তোতাপাখি মানুষের কথা নকল করতে পারে!"], ["🦚", "২. ময়ূর\nময়ূর ভারতের জাতীয় পাখি। পুরুষ ময়ূর তার রঙিন সুন্দর পেখম বিশাল পাখার মতো মেলে ধরে।"], ["🦉", "৩. পেঁচা\nপেঁচার চোখ বড় বড়, সে রাতে শিকার করে। সে মাথা প্রায় পুরোটা ঘুরিয়ে ফেলতে পারে, আর উড়ে প্রায় শব্দ না করে।"], ["🦅", "৪. ঈগল\nঈগল অনেক দূর থেকে ছোট জিনিসও দেখতে পায়। তার নখ শক্ত, আর সে উঁচু গাছে বা পাহাড়ের গায়ে বিশাল বাসা বানায়।"], ["🐧", "৫. পেঙ্গুইন\nপেঙ্গুইন উড়তে পারে না, কিন্তু দারুণ সাঁতার কাটে! তার ডানা সাঁতারের পাখনার মতো কাজ করে। অনেক পেঙ্গুইন থাকে অ্যান্টার্কটিকার মতো বরফের দেশে।"], ["🦆", "৬. হাঁস\nহাঁসের পালকে জল লাগে না, আর পায়ের পাতা জালিকাময় বলে সে সহজে সাঁতার কাটে। সে ডাকে ‘প্যাঁক প্যাঁক’!"], ["🦩", "৭. ফ্লেমিঙ্গো\nফ্লেমিঙ্গোর গোলাপি রং আসে তাদের খাবার থেকে। তারা প্রায়ই এক পায়ে দাঁড়িয়ে বিশ্রাম নেয়।"], ["🦢", "৮. রাজহাঁস\nরাজহাঁস লম্বা বাঁকা গলা নিয়ে সুন্দরভাবে হ্রদে ভাসে। রাজহাঁসের জোড়া প্রায়ই অনেক বছর একসঙ্গে থাকে।"], ["🐦‍⬛", "৯. কাক\nকাক খুব বুদ্ধিমান পাখি। সে ধাঁধার সমাধান করতে পারে আর মানুষের মুখ মনে রাখে।"], ["🐦", "১০. চড়ুই\nচড়ুই ছোট্ট পাখি, আমাদের বাড়ির কাছেই থাকে আর দল বেঁধে কিচিরমিচির করে। ২০ মার্চ বিশ্ব চড়ুই দিবস।"]], "lang": "bn"},
{"id": "fruits10-en", "cat": "learn", "title": "10 Yummy Fruits", "emoji": "🥭", "color": "#ffe3d0", "pages": [["🥭", "1. Mango\nMango is the national fruit of India and is often called the king of fruits. It is sweet and full of vitamins A and C."], ["🍎", "2. Apple\nApples are crunchy and juicy. They float on water because a part of every apple is air!"], ["🍌", "3. Banana\nBananas give you quick energy and have potassium. They grow in bunches, and a banana plant has a soft stem, not a wooden trunk."], ["🍊", "4. Orange\nOranges are full of vitamin C. Inside the peel, the juicy fruit is divided into neat little segments."], ["🍇", "5. Grapes\nGrapes grow in bunches on vines. When they are dried in the sun, they become raisins!"], ["🍉", "6. Watermelon\nWatermelon is about 92% water, so it is perfect on hot days. It is sweet and red inside, with black seeds."], ["🍍", "7. Pineapple\nPineapple has a rough skin and a spiky green crown. It grows on a low plant close to the ground, not on a tree."], ["🍓", "8. Strawberry\nStrawberries are red, sweet and a little sour. Their tiny seeds grow on the outside of the fruit!"], ["🥥", "9. Coconut\nCoconut trees grow near the sea. Inside the fruit there is sweet coconut water and white flesh that we eat."], ["🍋", "10. Lemon\nLemons are yellow and very sour. We squeeze lemon juice and mix it with sugar and water to make a cool drink."]]},
{"id": "fruits10-bn", "cat": "learn", "title": "১০টি মজার ফল", "emoji": "🥭", "color": "#ffe3d0", "pages": [["🥭", "১. আম\nআম ভারতের জাতীয় ফল, আর তাকে বলা হয় ফলের রাজা। এটি মিষ্টি, আর ভিটামিন এ ও সি-তে ভরা।"], ["🍎", "২. আপেল\nআপেল মচমচে আর রসালো। আপেলের একটা অংশ বাতাস, তাই সে জলে ভাসে!"], ["🍌", "৩. কলা\nকলা তাড়াতাড়ি শক্তি দেয় আর এতে আছে পটাসিয়াম। কলা ধরে কাঁদিতে, আর কলাগাছের কাণ্ড কাঠের নয়, নরম।"], ["🍊", "৪. কমলালেবু\nকমলালেবুতে প্রচুর ভিটামিন সি থাকে। খোসার ভেতরে রসালো কোয়াগুলো সাজানো থাকে।"], ["🍇", "৫. আঙুর\nআঙুর লতায় থোকায় থোকায় ধরে। রোদে শুকোলে আঙুর হয়ে যায় কিশমিশ!"], ["🍉", "৬. তরমুজ\nতরমুজের প্রায় ৯২ শতাংশই জল, তাই গরমের দিনে খুব ভালো। ভেতরটা লাল আর মিষ্টি, আর থাকে কালো বিচি।"], ["🍍", "৭. আনারস\nআনারসের খোসা খসখসে আর মাথায় কাঁটাওয়ালা সবুজ মুকুট। সে গাছে নয়, মাটির কাছের ছোট গাছে ফলে।"], ["🍓", "৮. স্ট্রবেরি\nস্ট্রবেরি লাল, মিষ্টি আর একটু টক। এর ছোট ছোট বিচি থাকে ফলের বাইরের গায়ে!"], ["🥥", "৯. নারকেল\nনারকেল গাছ সমুদ্রের ধারে ভালো হয়। ভেতরে থাকে মিষ্টি ডাবের জল, আর সাদা শাঁস যা আমরা খাই।"], ["🍋", "১০. লেবু\nলেবু হলুদ আর খুব টক। লেবুর রস চিপে চিনি-জল মিশিয়ে বানানো হয় ঠান্ডা শরবত।"]], "lang": "bn"},
{"id": "veg10-en", "cat": "learn", "title": "10 Healthy Vegetables", "emoji": "🥕", "color": "#d9f5d0", "pages": [["🥕", "1. Carrot\nCarrots grow under the soil. They have a nutrient that our body turns into vitamin A, which is good for our eyes."], ["🥔", "2. Potato\nPotatoes also grow underground. We eat them boiled, mashed or as crispy fries."], ["🍅", "3. Tomato\nTomatoes are really a fruit, but we cook them like a vegetable. They are red, juicy and full of vitamin C."], ["🧅", "4. Onion\nOnions have many layers, like a ball. When we cut one, a tiny gas makes our eyes teary!"], ["🍆", "5. Brinjal\nBrinjal, also called eggplant, is shiny and purple. It was first grown in South Asia, and it is lovely fried as begun bhaja!"], ["🥬", "6. Spinach\nSpinach is a leafy green vegetable. It has iron and vitamins that help us grow strong."], ["🥦", "7. Broccoli\nBroccoli looks like tiny green trees! The part we eat is actually its flower buds."], ["🥒", "8. Cucumber\nCucumbers are crunchy and cool, and they are about 96% water. We eat them in salads."], ["🌽", "9. Corn\nCorn grows in big cobs full of yellow kernels in neat rows. We eat it boiled, roasted or as popcorn!"], ["🎃", "10. Pumpkin\nPumpkins grow on long vines and can get really big. They are cooked in curries and sweets, and the seeds can be roasted."]]},
{"id": "veg10-bn", "cat": "learn", "title": "১০টি স্বাস্থ্যকর সবজি", "emoji": "🥕", "color": "#d9f5d0", "pages": [["🥕", "১. গাজর\nগাজর মাটির নিচে জন্মায়। এতে এমন উপাদান আছে, যা আমাদের শরীরে ভিটামিন এ হয়ে চোখের যত্ন নেয়।"], ["🥔", "২. আলু\nআলুও মাটির নিচে জন্মায়। আমরা সেদ্ধ, ভর্তা বা মুচমুচে ভাজা করে খাই।"], ["🍅", "৩. টমেটো\nটমেটো আসলে ফল, কিন্তু আমরা সবজির মতো রান্না করি। সে লাল, রসালো আর ভিটামিন সি-তে ভরা।"], ["🧅", "৪. পেঁয়াজ\nপেঁয়াজের অনেক স্তর, ঠিক বলের মতো। কাটলে এক ছোট্ট গ্যাস বেরিয়ে চোখে জল আনে!"], ["🍆", "৫. বেগুন\nবেগুন চকচকে আর বেগুনি রঙের। দক্ষিণ এশিয়াতেই এর চাষ শুরু হয়েছিল। বেগুনভাজা খেতে দারুণ!"], ["🥬", "৬. পালংশাক\nপালংশাক সবুজ পাতাওয়ালা সবজি। এতে আছে আয়রন ও ভিটামিন, যা আমাদের শক্ত-সবল হতে সাহায্য করে।"], ["🥦", "৭. ব্রকলি\nব্রকলি দেখতে ছোট্ট সবুজ গাছের মতো! আমরা আসলে এর ফুলের কুঁড়ি খাই।"], ["🥒", "৮. শসা\nশসা মচমচে আর ঠান্ডা, তার প্রায় ৯৬ শতাংশই জল। আমরা সালাদে খাই।"], ["🌽", "৯. ভুট্টা\nভুট্টার মোচায় সারি সারি হলুদ দানা সাজানো থাকে। আমরা সেদ্ধ, পোড়া বা পপকর্ন করে খাই!"], ["🎃", "১০. কুমড়ো\nকুমড়ো লম্বা লতায় ফলে আর খুব বড় হতে পারে। তরকারি রান্না হয়, আর বীজ ভেজে খাওয়া যায়।"]], "lang": "bn"},
{"id": "wonders7-en", "cat": "world", "title": "7 Wonders of the World", "emoji": "🏛️", "color": "#ffe8c8", "pages": [["🌍✨🏛️", "Long ago, people made a list of Seven Wonders. In 2007, millions of people voted to choose the New 7 Wonders of the World. Let’s visit them!"], ["🧱🏞️", "1. Great Wall of China (China)\nA long stone wall in China, built over many centuries to guard the land. It stretches for thousands of kilometres!"], ["⛰️🏜️", "2. Petra (Jordan)\nA city carved into rose-coloured rocks in the desert of Jordan, made by the Nabataean people long ago."], ["⛪🙌", "3. Christ the Redeemer (Brazil)\nA giant statue with open arms standing on a mountain above Rio de Janeiro in Brazil. It was finished in 1931."], ["🏔️🦙", "4. Machu Picchu (Peru)\nAn ancient Inca city high in the Andes mountains of Peru, built more than 500 years ago. Llamas wander there today!"], ["🏯🌞", "5. Chichen Itza (Mexico)\nA Mayan city in Mexico with a giant step pyramid called El Castillo. The Maya were great at maths and astronomy."], ["🏟️🏛️", "6. Colosseum (Italy)\nA huge round arena in Rome, Italy, built about 2,000 years ago. Thousands of people gathered here to watch shows."], ["🕌🤍", "7. Taj Mahal (India)\nA shining white marble tomb in Agra, India. Emperor Shah Jahan built it in memory of his wife Mumtaz Mahal."], ["🔺🐪", "Bonus: Great Pyramid of Giza (Egypt)\nThe Great Pyramid in Egypt is the only one of the ancient Seven Wonders still standing today. It is more than 4,500 years old!"]]},
{"id": "wonders7-bn", "cat": "world", "title": "বিশ্বের সপ্ত আশ্চর্য", "emoji": "🏛️", "color": "#ffe8c8", "pages": [["🌍✨🏛️", "অনেক আগে মানুষ সাত আশ্চর্যের তালিকা বানিয়েছিল। ২০০৭ সালে লক্ষ লক্ষ মানুষ ভোট দিয়ে বেছে নিয়েছিল পৃথিবীর নতুন সাত আশ্চর্য। চলো ঘুরে আসি!"], ["🧱🏞️", "১. চীনের মহাপ্রাচীর (চীন)\nচীনের এক লম্বা পাথরের প্রাচীর, যা বহু শতাব্দী ধরে দেশ রক্ষার জন্য তৈরি হয়েছিল। এটি হাজার হাজার কিলোমিটার লম্বা!"], ["⛰️🏜️", "২. পেত্রা (জর্ডান)\nজর্ডানের মরুভূমিতে গোলাপি পাথর কেটে বানানো এক প্রাচীন শহর, যা বহু আগে নাবাতিয়ান জাতির মানুষ তৈরি করেছিল।"], ["⛪🙌", "৩. ক্রাইস্ট দ্য রিডিমার (ব্রাজিল)\nব্রাজিলের রিও ডি জেনেইরোর পাহাড়ের চূড়ায় দুই হাত মেলে দাঁড়ানো এক বিশাল মূর্তি। এটি ১৯৩১ সালে শেষ হয়।"], ["🏔️🦙", "৪. মাচু পিচ্চু (পেরু)\nপেরুর আন্দিজ পাহাড়ের উঁচুতে ইনকা জাতির এক প্রাচীন শহর, যা পাঁচশো বছরেরও বেশি আগে তৈরি। আজও সেখানে লামারা ঘুরে বেড়ায়!"], ["🏯🌞", "৫. চিচেন ইৎজা (মেক্সিকো)\nমেক্সিকোতে মায়া জাতির এক শহর, যেখানে আছে ‘এল কাস্তিলো’ নামের সিঁড়িওয়ালা বিশাল পিরামিড। মায়ারা অঙ্ক আর জ্যোতির্বিজ্ঞানে দক্ষ ছিল।"], ["🏟️🏛️", "৬. কলোসিয়াম (ইতালি)\nইতালির রোমে প্রায় দু’হাজার বছর আগে তৈরি এক বিশাল গোলাকার স্টেডিয়াম। হাজার হাজার মানুষ এখানে অনুষ্ঠান দেখতে জড়ো হতো।"], ["🕌🤍", "৭. তাজমহল (ভারত)\nভারতের আগ্রায় সাদা মার্বেলের এক ঝকঝকে সমাধিসৌধ। সম্রাট শাহজাহান তাঁর স্ত্রী মমতাজ মহলের স্মৃতিতে এটি বানিয়েছিলেন।"], ["🔺🐪", "বোনাস: গিজার মহা পিরামিড (মিশর)\nমিশরের গিজার মহা পিরামিড প্রাচীন সাত আশ্চর্যের মধ্যে একমাত্র যেটি আজও দাঁড়িয়ে আছে। এর বয়স সাড়ে চার হাজার বছরেরও বেশি!"]], "lang": "bn"},
{"id": "solar-en", "cat": "space", "title": "Our Solar System", "emoji": "🪐", "color": "#e0dcff", "pages": [["🌞🪐🌍", "Our solar system has one star, the Sun, and eight planets that travel around it. In order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune."], ["☀️", "The Sun\nThe Sun is a giant star made of hot, glowing gas. It is so big that more than a million Earths could fit inside. Its light takes about 8 minutes to reach us."], ["⚪🔥❄️", "1. Mercury\nMercury is the smallest planet and the closest to the Sun. It is very hot in the day and freezing cold at night."], ["🟡☁️🌡️", "2. Venus\nVenus is the hottest planet, covered by thick clouds. It spins backwards compared to most planets, and it shines in the sky as the ‘evening star’."], ["🌍💙🌿", "3. Earth\nEarth is our home, the only planet we know that has life. About 70% of it is covered with water. It has one Moon."], ["🔴🌋", "4. Mars\nMars is the red planet because of its rusty dust. It has the tallest volcano in the solar system, Olympus Mons, and two tiny moons."], ["🟠🌪️", "5. Jupiter\nJupiter is the biggest planet. It has a giant storm called the Great Red Spot and many moons. It is made mostly of gas."], ["🪐✨", "6. Saturn\nSaturn is famous for its beautiful rings made of ice and rocks. It is so light for its size that it could float in a giant bathtub!"], ["🔵🌀", "7. Uranus\nUranus is a cold blue-green planet that spins tilted on its side, like a rolling ball. It takes 84 years to go around the Sun."], ["🔷💨", "8. Neptune\nNeptune is the farthest planet, deep blue, very windy and very cold. One year on Neptune is about 165 Earth years long!"], ["⚪❄️", "Pluto, the Dwarf Planet\nPluto was once called the ninth planet. In 2006 scientists named it a dwarf planet, because it is small and has not cleared the space around its path."], ["🌞🪐✨", "Memory game!\nMercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. Make up a funny sentence using the first letters to remember the order!"]]},
{"id": "solar-bn", "cat": "space", "title": "আমাদের সৌরজগৎ", "emoji": "🪐", "color": "#e0dcff", "pages": [["🌞🪐🌍", "আমাদের সৌরজগতে আছে একটি তারা, সূর্য, আর তাকে ঘিরে ঘোরা আটটি গ্রহ। সূর্যের কাছ থেকে দূরে: বুধ, শুক্র, পৃথিবী, মঙ্গল, বৃহস্পতি, শনি, ইউরেনাস, নেপচুন।"], ["☀️", "সূর্য\nসূর্য এক বিশাল তারা, গরম জ্বলন্ত গ্যাসে গড়া। এত বড় যে এর ভেতরে দশ লক্ষেরও বেশি পৃথিবী ঢুকে যায়। এর আলো আমাদের কাছে পৌঁছাতে প্রায় ৮ মিনিট লাগে।"], ["⚪🔥❄️", "১. বুধ\nবুধ সবচেয়ে ছোট গ্রহ আর সূর্যের সবচেয়ে কাছে। দিনে সে ভীষণ গরম, আর রাতে হাড়কাঁপানো ঠান্ডা।"], ["🟡☁️🌡️", "২. শুক্র\nশুক্র সবচেয়ে গরম গ্রহ, ঘন মেঘে ঢাকা। বেশিরভাগ গ্রহের উল্টো দিকে সে ঘোরে। আকাশে ‘সন্ধ্যাতারা’ হয়ে সে উজ্জ্বল জ্বলে।"], ["🌍💙🌿", "৩. পৃথিবী\nপৃথিবী আমাদের বাড়ি, জীবন আছে এমন একমাত্র গ্রহ, যেটা আমরা জানি। এর প্রায় ৭০ শতাংশ জলে ঢাকা। তার একটিই চাঁদ।"], ["🔴🌋", "৪. মঙ্গল\nমঙ্গল লাল গ্রহ, কারণ তার মাটিতে জং-ধরা ধুলো। সৌরজগতের সবচেয়ে উঁচু আগ্নেয়গিরি অলিম্পাস মনস এখানে, আর আছে দুটি ছোট চাঁদ।"], ["🟠🌪️", "৫. বৃহস্পতি\nবৃহস্পতি সবচেয়ে বড় গ্রহ। এর গায়ে আছে ‘গ্রেট রেড স্পট’ নামে এক বিশাল ঝড়, আর আছে অনেক চাঁদ। সে প্রধানত গ্যাসে গড়া।"], ["🪐✨", "৬. শনি\nশনি তার সুন্দর বলয়ের জন্য বিখ্যাত, যা বরফ আর পাথরের টুকরো দিয়ে গড়া। আকারের তুলনায় সে এত হালকা যে, বিশাল এক জলের পাত্রে ভেসে থাকত!"], ["🔵🌀", "৭. ইউরেনাস\nইউরেনাস ঠান্ডা, নীলচে-সবুজ গ্রহ, যে কাত হয়ে গড়িয়ে চলা বলের মতো ঘোরে। সূর্যকে একবার ঘুরতে তার লাগে ৮৪ বছর।"], ["🔷💨", "৮. নেপচুন\nনেপচুন সবচেয়ে দূরের গ্রহ, গাঢ় নীল, ভীষণ ঝোড়ো আর ঠান্ডা। নেপচুনের এক বছর পৃথিবীর প্রায় ১৬৫ বছরের সমান!"], ["⚪❄️", "প্লুটো, বামন গ্রহ\nপ্লুটোকে আগে নবম গ্রহ বলা হতো। ২০০৬ সালে বিজ্ঞানীরা একে বামন গ্রহ নাম দেন, কারণ সে ছোট আর নিজের পথের আশপাশ পরিষ্কার করতে পারেনি।"], ["🌞🪐✨", "মনে রাখার খেলা!\nসূর্যের কাছ থেকে দূরে: বুধ, শুক্র, পৃথিবী, মঙ্গল, বৃহস্পতি, শনি, ইউরেনাস, নেপচুন। নামগুলোর প্রথম অক্ষর দিয়ে একটা মজার বাক্য বানিয়ে ফেলো!"]], "lang": "bn"},
{"id": "galaxy-en", "cat": "space", "title": "The Galaxy: Our Milky Way", "emoji": "🌌", "color": "#dcd6f5", "pages": [["🌌", "What is a Galaxy?\nA galaxy is a giant family of stars, gas, dust and planets, all held together by gravity. There are billions of galaxies in the universe."], ["🌌✨", "Our Milky Way\nWe live in a galaxy called the Milky Way. It has hundreds of billions of stars! On a very dark night, we can see it as a pale, milky band across the sky."], ["🌀", "A Spiral Galaxy\nThe Milky Way is a spiral galaxy, shaped like a giant pinwheel with curved arms. It is about 100,000 light-years wide."], ["☀️📍", "Where Are We?\nOur Sun and solar system sit in one of the spiral arms, called the Orion Arm, far from the centre of the galaxy."], ["⏱️💡", "What is a Light-year?\nA light-year is how far light travels in one year, about 9.5 trillion kilometres. We use it to measure huge distances in space."], ["🔭🌀🥚", "Different Shapes\nGalaxies come in different shapes: spirals like a pinwheel, ellipticals like a squashed ball, and irregular ones with no clear shape."], ["🌌🔭", "Andromeda\nAndromeda is the nearest big galaxy to ours, about 2.5 million light-years away. You can spot it as a faint smudge on a dark night!"], ["⚫🌀", "The Black Hole\nAt the centre of our galaxy lies a giant black hole called Sagittarius A*. Its gravity is so strong that even light cannot escape. Don’t worry, it is very, very far away!"], ["⭐🌈", "Baby Stars\nNew stars are born inside giant clouds of gas and dust called nebulae. Some nebulae glow in beautiful colours!"], ["🌠🧑‍🚀", "So Many Galaxies!\nThe universe has billions of galaxies, each with billions of stars. How many planets are out there? Scientists are still exploring to find out!"]]},
{"id": "galaxy-bn", "cat": "space", "title": "ছায়াপথ: আমাদের মিল্কি ওয়ে", "emoji": "🌌", "color": "#dcd6f5", "pages": [["🌌", "ছায়াপথ কী?\nছায়াপথ বা গ্যালাক্সি হলো তারা, গ্যাস, ধুলো আর গ্রহের এক বিশাল পরিবার, যাদের মহাকর্ষ বল একসঙ্গে ধরে রাখে। মহাবিশ্বে আছে কোটি কোটি ছায়াপথ।"], ["🌌✨", "আমাদের আকাশগঙ্গা\nআমরা যে ছায়াপথে থাকি, তার নাম আকাশগঙ্গা বা মিল্কি ওয়ে। এতে আছে হাজার হাজার কোটি তারা! খুব অন্ধকার রাতে সেটাকে আকাশ জুড়ে দুধের মতো সাদা এক ফিতের মতো দেখা যায়।"], ["🌀", "সর্পিল ছায়াপথ\nআকাশগঙ্গা সর্পিল আকৃতির ছায়াপথ, দেখতে বিশাল চরকির মতো, বাঁকানো বাহুওয়ালা। এর প্রস্থ প্রায় এক লক্ষ আলোকবর্ষ।"], ["☀️📍", "আমরা কোথায়?\nআমাদের সূর্য ও সৌরজগৎ একটি সর্পিল বাহুতে আছে, যার নাম ওরিয়ন বাহু। সে ছায়াপথের কেন্দ্র থেকে অনেক দূরে।"], ["⏱️💡", "আলোকবর্ষ কী?\nআলোকবর্ষ হলো আলো এক বছরে যতটা পথ যায়, প্রায় ৯ লক্ষ ৪৬ হাজার কোটি কিলোমিটার। মহাকাশের বিশাল দূরত্ব মাপতে আমরা এটি ব্যবহার করি।"], ["🔭🌀🥚", "নানা আকারের ছায়াপথ\nছায়াপথের আকার নানা রকম: চরকির মতো সর্পিল, চ্যাপ্টা বলের মতো উপবৃত্তাকার, আর কোনো নির্দিষ্ট আকার ছাড়া অনিয়মিত।"], ["🌌🔭", "অ্যান্ড্রোমিডা\nঅ্যান্ড্রোমিডা আমাদের সবচেয়ে কাছের বড় ছায়াপথ, প্রায় ২৫ লক্ষ আলোকবর্ষ দূরে। অন্ধকার রাতে এটিকে আবছা একটা ছোপের মতো দেখা যায়!"], ["⚫🌀", "কৃষ্ণগহ্বর\nআমাদের ছায়াপথের কেন্দ্রে আছে স্যাজিটেরিয়াস এ-স্টার নামে এক বিশাল কৃষ্ণগহ্বর। তার টান এত জোরালো যে আলোও পালাতে পারে না। ভয় নেই, সে অনেক অনেক দূরে!"], ["⭐🌈", "নতুন তারার জন্ম\nবিশাল গ্যাস ও ধুলোর মেঘ, যার নাম নীহারিকা, তার ভেতরে নতুন তারার জন্ম হয়। কিছু নীহারিকা সুন্দর রঙে ঝলমল করে!"], ["🌠🧑‍🚀", "কত কত ছায়াপথ!\nমহাবিশ্বে আছে কোটি কোটি ছায়াপথ, আর প্রতিটিতে কোটি কোটি তারা। সেখানে আরও কত গ্রহ আছে? বিজ্ঞানীরা আজও খুঁজে চলেছেন!"]], "lang": "bn"},

{"id": "transport10-en", "cat": "learn", "title": "10 Vehicles We Ride", "emoji": "🚌", "color": "#ffeaa8", "pages": [["🚲", "1. Bicycle\nA bicycle has two wheels and pedals. It needs no petrol, keeps the air clean, and is great exercise. Always wear a helmet!"], ["🛺", "2. Auto-rickshaw\nAn auto-rickshaw has three wheels and is small enough to zip through narrow streets. In some countries it is called a tuk-tuk."], ["🚗", "3. Car\nA car has four wheels and an engine. The driver steers with the steering wheel. Everyone must wear a seat belt!"], ["🚌", "4. Bus\nA bus carries many people at once, so fewer cars are needed on the road. School buses take children safely to school."], ["🚋", "5. Tram\nA tram runs on tracks in the middle of city streets using electricity. Kolkata is the only city in India where trams still run. They began in 1873!"], ["🚇", "6. Metro\nThe metro is a fast train that runs underground or on raised tracks, away from traffic jams. Kolkata opened India’s first metro line in 1984."], ["🚂", "7. Train\nA train pulls many coaches along railway tracks and can travel very long distances. Indian Railways carries millions of passengers every day!"], ["🚢", "8. Ship\nA ship sails on the sea or big rivers, carrying people and heavy goods. It floats because its hollow shape pushes aside a lot of water."], ["✈️", "9. Aeroplane\nAn aeroplane flies high in the sky using its wings and powerful engines. It can cross countries and oceans in just a few hours."], ["🚁", "10. Helicopter\nA helicopter has spinning blades on top. It can go straight up and down and even hover in one place, which helps in rescues."]]},
{"id": "transport10-bn", "cat": "learn", "title": "১০টি যানবাহন", "emoji": "🚌", "color": "#ffeaa8", "pages": [["🚲", "১. সাইকেল\nসাইকেলে দুটি চাকা আর প্যাডেল থাকে। এতে পেট্রোল লাগে না, বাতাস পরিষ্কার থাকে, আর ভালো ব্যায়ামও হয়। সবসময় হেলমেট পোরো!"], ["🛺", "২. অটোরিকশা\nঅটোরিকশার তিনটি চাকা, তাই সরু রাস্তাতেও সে সহজে চলে। কোনো কোনো দেশে একে টুকটুক বলে।"], ["🚗", "৩. গাড়ি\nগাড়ির চারটি চাকা আর ইঞ্জিন থাকে। চালক স্টিয়ারিং ঘুরিয়ে গাড়ি চালায়। সবাইকে সিটবেল্ট বাঁধতে হয়!"], ["🚌", "৪. বাস\nবাস একসঙ্গে অনেক মানুষকে নিয়ে যায়, তাই রাস্তায় গাড়ি কম লাগে। স্কুলবাস বাচ্চাদের নিরাপদে স্কুলে পৌঁছে দেয়।"], ["🚋", "৫. ট্রাম\nট্রাম শহরের রাস্তার মাঝখানে লাইনের ওপর দিয়ে বিদ্যুতে চলে। ভারতে একমাত্র কলকাতাতেই আজও ট্রাম চলে। ১৮৭৩ সালে এর শুরু!"], ["🚇", "৬. মেট্রো\nমেট্রো এমন দ্রুত ট্রেন, যা মাটির নিচে বা উঁচু লাইনে চলে, যানজট এড়িয়ে। ১৯৮৪ সালে কলকাতায় ভারতের প্রথম মেট্রো লাইন চালু হয়।"], ["🚂", "৭. ট্রেন\nট্রেন অনেক কামরা টেনে রেললাইন ধরে দূর দূর যায়। ভারতীয় রেল প্রতিদিন লক্ষ লক্ষ যাত্রী বহন করে!"], ["🚢", "৮. জাহাজ\nজাহাজ সমুদ্র বা বড় নদীতে চলে, মানুষ আর ভারী মালপত্র নিয়ে যায়। ফাঁপা আকারের জন্য সে অনেক জল সরায়, তাই ভেসে থাকে।"], ["✈️", "৯. উড়োজাহাজ\nউড়োজাহাজ ডানা আর শক্তিশালী ইঞ্জিনের জোরে আকাশে ওড়ে। কয়েক ঘণ্টায় সে দেশ ও মহাসাগর পেরিয়ে যায়।"], ["🚁", "১০. হেলিকপ্টার\nহেলিকপ্টারের মাথায় ঘুরন্ত পাখা থাকে। সে সোজা ওপরে-নিচে উঠতে-নামতে আর এক জায়গায় ভেসে থাকতে পারে। উদ্ধারের কাজে সে খুব দরকারি।"]], "lang": "bn"},

var drawerEl=document.getElementById("drawer"),cv=document.getElementById("cv"),cx=cv.getContext("2d",{willReadFrequently:true}),DRS={},D=null,tool="brush",bsize=6,bcolor="#e53935",undo=[],drawing=false,lastX=0,lastY=0,SAVED={};
try{SAVED=JSON.parse(localStorage.getItem("kwDraw1")||"{}")}catch(e){SAVED={}}

var COLORS=["#000000","#e53935","#fb8c00","#fdd835","#43a047","#1e88e5","#8e24aa","#6d4c41","#ec407a","#00acc1","#9e9e9e","#ffffff"];
(function(){var pal=document.getElementById("pal");COLORS.forEach(function(c){var b=document.createElement("button");b.className="sw"+(c===bcolor?" on":"");b.style.background=c;b.setAttribute("data-c",c);b.setAttribute("aria-label","Colour "+c);b.onclick=function(){setColor(c)};pal.appendChild(b)});
 var pk=document.createElement("input");pk.type="color";pk.id="pick";pk.value="#ff00aa";pk.title="Pick any colour";pk.oninput=function(){setColor(pk.value)};pal.appendChild(pk)})();
function setColor(c){bcolor=c;if(tool==="eraser")setTool("brush");Array.prototype.forEach.call(document.querySelectorAll(".sw"),function(x){x.classList.toggle("on",x.getAttribute("data-c")===c)})}
function setTool(t){tool=t;Array.prototype.forEach.call(document.querySelectorAll("[data-tool]"),function(x){x.classList.toggle("on",x.getAttribute("data-tool")===t)})}
Array.prototype.forEach.call(document.querySelectorAll("[data-tool]"),function(x){x.onclick=function(){setTool(x.getAttribute("data-tool"))}});
Array.prototype.forEach.call(document.querySelectorAll("[data-size]"),function(x){x.onclick=function(){bsize=+x.getAttribute("data-size");Array.prototype.forEach.call(document.querySelectorAll("[data-size]"),function(y){y.classList.toggle("on",y===x)})}});
function noteColor(c){var a=D.cols[D.idx]||(D.cols[D.idx]=[]);if(a.indexOf(c)<0)a.push(c)}
function pushUndo(){undo.push(cx.getImageData(0,0,600,600));if(undo.length>12)undo.shift()}
function pos(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]}
function hexRGB(h){var n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function floodFill(x,y,hex){var W=600,H=600,img=cx.getImageData(0,0,W,H),d=img.data,i0=(y*W+x)*4,tr=d[i0],tg=d[i0+1],tb=d[i0+2],c=hexRGB(hex);
 if(Math.abs(tr-c[0])+Math.abs(tg-c[1])+Math.abs(tb-c[2])<8)return;
 var seen=new Uint8Array(W*H),st=[x,y],tol=90;
 while(st.length){var yy=st.pop(),xx=st.pop();if(xx<0||yy<0||xx>=W||yy>=H)continue;var p=yy*W+xx;if(seen[p])continue;seen[p]=1;var i=p*4;
  if(Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb)>tol)continue;
  d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;st.push(xx+1,yy,xx-1,yy,xx,yy+1,xx,yy-1)}
 cx.putImageData(img,0,0)}
cv.addEventListener("pointerdown",function(e){e.preventDefault();if(!D)return;var p=pos(e);pushUndo();
 if(tool==="fill"){floodFill(Math.floor(p[0]),Math.floor(p[1]),bcolor);noteColor(bcolor);D.stk[D.idx]=(D.stk[D.idx]||0)+1;return}
 drawing=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}
 lastX=p[0];lastY=p[1];cx.lineCap="round";cx.lineJoin="round";cx.lineWidth=bsize;
 var col=tool==="eraser"?"#ffffff":bcolor;cx.strokeStyle=col;cx.fillStyle=col;cx.beginPath();cx.arc(p[0],p[1],bsize/2,0,6.2832);cx.fill();
 if(tool==="brush"){noteColor(bcolor);D.stk[D.idx]=(D.stk[D.idx]||0)+1}});
cv.addEventListener("pointermove",function(e){if(!drawing)return;e.preventDefault();var p=pos(e);cx.beginPath();cx.moveTo(lastX,lastY);cx.lineTo(p[0],p[1]);cx.stroke();lastX=p[0];lastY=p[1]});
function endStroke(){drawing=false}
cv.addEventListener("pointerup",endStroke);cv.addEventListener("pointercancel",endStroke);
function doUndo(){if(undo.length)cx.putImageData(undo.pop(),0,0)}
function saveCur(){if(D)D.img[D.idx]=cv.toDataURL()}
function openDraw(){drawerEl.style.display="flex";D=DRS[cur.id]||(DRS[cur.id]={idx:0,img:{},stk:{},cols:{}});document.getElementById("dtitle").textContent=cur.title;loadDrawing(D.idx)}
function loadDrawing(i){D.idx=i;undo=[];cx.fillStyle="#ffffff";cx.fillRect(0,0,600,600);
 var im=D.img[i];if(im){var I=new Image();I.onload=function(){if(D.idx===i)cx.drawImage(I,0,0)};I.src=im}
 var d=cur.draw[i];document.getElementById("dpic").textContent=d[0];
 document.getElementById("dnames").innerHTML="<small>Drawing "+(i+1)+" of 10 · Draw me!</small><b>"+d[1]+"</b><span lang=\"bn\">"+d[2]+"</span><span lang=\"hi\">"+d[3]+"</span>";
 document.getElementById("dprev").disabled=i===0;document.getElementById("dnext").disabled=i===9;updateDots();updateScore()}
function changeDrawing(j){if(j<0||j>9||j===D.idx)return;saveCur();loadDrawing(j)}
function updateDots(){var b=bookScores(),h="";for(var i=0;i<10;i++)h+="<span class=\""+(b[i]!=null?"done ":"")+(i===D.idx?"cur":"")+"\" data-i=\""+i+"\">"+(i+1)+"</span>";
 var el=document.getElementById("ddots");el.innerHTML=h;Array.prototype.forEach.call(el.children,function(sp){sp.onclick=function(){changeDrawing(+sp.getAttribute("data-i"))}})}
function updateScore(){var b=bookScores(),t=0,n=0;for(var k in b){t+=b[k];n++}document.getElementById("dscore").textContent="⭐ "+t+" · "+n+"/10"}
function scoreNow(){var d=cx.getImageData(0,0,600,600).data,n=0,t=0;for(var y=0;y<600;y+=3)for(var x=0;x<600;x+=3){var i=(y*600+x)*4;t++;if(d[i]<240||d[i+1]<240||d[i+2]<240)n++}
 var cov=n/t,cl=(D.cols[D.idx]||[]).length,st=D.stk[D.idx]||0;return Math.round(Math.min(cov/0.12,1)*50+Math.min(cl,4)*10+Math.min(st/10,1)*10)}
function modal(h,btns){var m=document.getElementById("mbox");m.innerHTML=h+"<div class=\"mbtns\"></div>";var bx=m.lastChild;
 btns.forEach(function(b){var x=document.createElement("button");x.className="btn";x.textContent=b[0];x.onclick=function(){closeModal();if(b[1])b[1]()};bx.appendChild(x)});document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
document.getElementById("ddone").onclick=function(){var sc=scoreNow();
 if(sc<15){modal("<div class=\"mstars\">✏️</div><p>Let’s draw a little more!<br>Draw the picture, add some colour, then press Done again.</p>",[["OK"]]);return}
 var b=bookScores();if(!(b[D.idx]>=sc))b[D.idx]=sc;persist();saveCur();updateDots();updateScore();
 var stars=sc>=80?3:sc>=50?2:1,msg=stars===3?"Wonderful! বাহ্! शाबाश!":stars===2?"Great job! দারুণ! बहुत बढ़िया!":"Nice try! Add more colours next time.";
 var h="<div class=\"mstars\">"+"⭐".repeat(stars)+"</div><div class=\"mscore\">Score: "+sc+" / 100</div><p>"+msg+(b[D.idx]>sc?"<br><small>Your best: "+b[D.idx]+"</small>":"")+"<br><small>The score rewards effort and colours 🎨</small></p>";
 var keys=Object.keys(b);if(keys.length===10){var tot=0;keys.forEach(function(k){tot+=b[k]});h+="<p>🏆 Book complete! Total: "+tot+" / 1000</p>"}
 var btns=[["Keep drawing"]];if(D.idx<9)btns.push(["Next drawing ▶",function(){changeDrawing(D.idx+1)}]);else btns.push(["Library 📚",function(){saveCur();home_()}]);
 modal(h,btns)};

 if(e.key==="ArrowRight")changeDrawing(D.idx+1);else if(e.key==="ArrowLeft")changeDrawing(D.idx-1);else if(e.key==="Escape"){saveCur();home_()}else if((e.ctrlKey||e.metaKey)&&e.key==="z"){e.preventDefault();doUndo()}}
drawChips();drawGrid();render();
